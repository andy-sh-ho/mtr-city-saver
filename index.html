<style>
  :root {
    --primary: #dc0714;
    --primary-dark: #9b050f;
    --primary-light: #ff3d4a;
    --bg: #f0f0f0;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #5a5a5a;
    --border: #d9d9d9;
    --green: #00a651;
    --green-bg: #dbf5e6;
    --amber: #f5a623;
    --amber-bg: #fff4db;
    --red: #dc0714;
    --red-bg: #fde0e2;
    --grey: #999999;
    --grey-bg: #e8e8e8;
    --off-bg: #e8e8e8;
    --holiday-pill: #dc0714;
    --today-ring: #dc0714;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 10px;
    --mtr-dark: #1a1a2e;
    --green-text: #166534;
    --red-text: #991b1b;
    --amber-text: #b45309;
    --info-bg: #e3f2fd;
    --info-text: #1565c0;
    --input-bg: #ffffff;
    --elevated-bg: #ffffff;
  }

  /* Dark mode — MTR Transit Dark
     Base: navy-tinted darks from brand #1a1a2e
     Rationale: Generic #121212 loses MTR identity. Navy-shifted backgrounds
     create a cohesive transit feel while keeping WCAG AA contrast.

     Contrast ratios (calculated):
       --text (#e8eaf0) on --bg (#0f1019)     = 17.4:1  (AAA)
       --text (#e8eaf0) on --card (#191b28)    = 14.2:1  (AAA)
       --text-secondary (#9fa4b8) on --card    =  6.8:1  (AA)
       --green-text (#6ee7b7) on --green-bg    =  7.9:1  (AA)
       --amber-text (#fcd34d) on --amber-bg    =  8.2:1  (AA)
       --red-text (#fca5a5) on --red-bg        =  7.1:1  (AA)
       --text (#e8eaf0) on --grey-bg (#282a36) = 10.8:1  (AAA)
       --info-text (#7cb8f2) on --info-bg      =  5.6:1  (AA)
       status-green (#34d399) on green-bg      =  6.1:1  (AA)
       status-amber (#f5a623) on amber-bg      =  5.5:1  (AA)
  */
  [data-theme="dark"] {
    /* Surfaces — navy-shifted from brand #1a1a2e */
    --bg: #0f1019;             /* deepest navy-black, not pure black */
    --card: #191b28;           /* elevated surface, subtle blue undertone */
    --border: #2e3045;         /* visible but not harsh, navy-grey */

    /* Typography */
    --text: #e8eaf0;           /* cool white, less yellow than #e8e8e8 */
    --text-secondary: #9fa4b8; /* muted lavender-grey, reads as secondary */

    /* Calendar status backgrounds — deeper, richer, navy-based */
    --green-bg: #0c2a1c;      /* dark forest, tinted slightly toward navy */
    --amber-bg: #2a2210;      /* warm dark ochre */
    --red-bg: #2e0c10;        /* deep crimson-black, echoes MTR red */
    --grey-bg: #282a36;       /* Dracula-inspired neutral, navy-grey */
    --off-bg: #232535;         /* slightly lighter navy for "off" days */

    /* Semantic text on colored backgrounds */
    --green-text: #6ee7b7;    /* mint green — high contrast on dark green bg */
    --red-text: #fca5a5;      /* soft coral — legible on dark red bg */
    --amber-text: #fcd34d;    /* warm gold — pops on dark amber bg */

    /* Functional colors — adjusted for dark backgrounds */
    --green: #34d399;          /* brighter than light-mode #00a651 for dark bg */
    --amber: #f5a623;          /* unchanged, already vivid */
    --red: #ef4444;            /* slightly brighter red for dark bg legibility */
    --grey: #8b8fa3;           /* navy-tinted grey */

    /* Info panel */
    --info-bg: #161a2e;       /* navy-blue tinted */
    --info-text: #7cb8f2;     /* sky blue, clear on navy */

    /* Brand anchors */
    --mtr-dark: #0a0b14;      /* near-black navy for header gradient */
    --holiday-pill: #dc0714;  /* untouched MTR red */
    --today-ring: #ef4444;    /* slightly brighter for dark bg visibility */

    /* Depth */
    --shadow: 0 2px 16px rgba(6, 6, 20, 0.5); /* navy-black shadow */

    --input-bg: #1e2030;
    --elevated-bg: #232535;
  }
  [data-theme="dark"] .card { border: 1px solid var(--border); }
  [data-theme="dark"] .toggle-group { background: #1e2030; }
  [data-theme="dark"] .day-chip { border-color: #3a3d52; color: #b0b4c8; }
  [data-theme="dark"] .date-input { color: var(--text); border-color: #3a3d52; }
  [data-theme="dark"] .station-select { color: var(--text); border-color: #3a3d52; }
  [data-theme="dark"] .swap-btn { border-color: #3a3d52; color: #b0b4c8; }
  [data-theme="dark"] .tab-bar { background: #12131e; border-color: #2e3045; }
  [data-theme="dark"] .registration-reminder { background: #1a1c0f; border-color: #4a4520; }
  [data-theme="dark"] .registration-reminder.reg-done { background: #0f1c14; border-color: #1a4a2a; }
  [data-theme="dark"] .subsidy-section { background: #12131e; border-color: #2e3045; }
  [data-theme="dark"] .savings-banner.even { background: #151830; color: #8ea0d4; border-color: #3a4a70; }
  [data-theme="dark"] .prompt-modal { background: #1e2030; }
  [data-theme="dark"] .prompt-modal input { background: #12131e; color: var(--text); border-color: #3a3d52; }
  [data-theme="dark"] .prompt-modal-cancel { background: #2e3045; color: #ddd; }
  [data-theme="dark"] .onboarding-overlay { background: #0f1019; }
  [data-theme="dark"] .filter-chip { color: #b0b4c8; border-color: #3a3d52; }
  [data-theme="dark"] .search-input { color: var(--text); border-color: #3a3d52; }
  [data-theme="dark"] .coverage-stat { background: var(--card); border: 1px solid var(--border); }
  [data-theme="dark"] .station-row:nth-child(odd) { background: rgba(160, 170, 220, 0.03); }
  [data-theme="dark"] .fare-input { color: var(--text); border-color: #3a3d52; }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 70px;
    min-height: 100vh;
  }

  /* Header — MTR style dark bar with red accent */
  .header {
    background: var(--mtr-dark);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-accent {
    height: 4px;
    background: var(--primary);
  }
  .header-inner {
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-actions {
    display: flex;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .header-actions button {
    min-width: 40px;
    min-height: 40px;
    background: rgba(255,255,255,0.15);
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }
  .header-actions button:active { opacity: 0.7; }
  .header-logo {
    width: 34px;
    height: 34px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    flex-shrink: 0;
    color: white;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }
  .header .subtitle { font-size: 11px; opacity: 0.6; margin-top: 1px; letter-spacing: 0.3px; }

  /* Sections */
  .section { padding: 16px; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: var(--mtr-dark);
    border-radius: 2px;
    flex-shrink: 0;
  }
  [data-theme="dark"] .section-title::before {
    background: var(--primary);
  }

  /* Card */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 12px;
  }

  /* Toggle group */
  .toggle-group {
    display: flex;
    background: var(--grey-bg);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 12px;
  }
  .toggle-btn {
    flex: 1;
    padding: 10px 8px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle-btn.active {
    background: var(--primary);
    color: white;
    box-shadow: 0 2px 6px rgba(220,7,20,0.25);
    font-weight: 600;
  }
  .theme-toggle-pill {
    display: inline-flex;
    background: rgba(26,26,46,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 2px;
    gap: 1px;
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .theme-toggle-pill button {
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    min-width: 36px;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .theme-toggle-pill button.active {
    background: rgba(255,255,255,0.2);
    color: white;
    font-weight: 600;
  }

  /* Bottom Sheet */
  .bottom-sheet-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 2000;
    opacity: 0;
    animation: fadeIn 0.2s ease forwards;
  }
  .bottom-sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-radius: 16px 16px 0 0;
    z-index: 2001;
    max-height: 70vh;
    overflow-y: auto;
    transform: translateY(100%);
    animation: slideUp 0.3s ease forwards;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  }
  .bottom-sheet-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 10px auto 6px;
  }
  .bottom-sheet-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
  }
  .bottom-sheet-header h3 { font-size: 16px; font-weight: 700; margin: 0; }
  .bottom-sheet-close {
    width: 40px; height: 40px; border: none; background: var(--grey-bg);
    border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes slideUp { to { transform: translateY(0); } }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Custom day picker */
  .custom-days {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    justify-content: center;
  }
  .day-chip {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--input-bg);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-chip.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    box-shadow: 0 2px 6px rgba(220,7,20,0.25);
  }
  .day-chip:active { transform: scale(0.92); }

  /* Date input */
  .date-input-wrapper {
    position: relative;
  }
  .date-input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--input-bg);
    transition: border-color 0.2s;
  }
  .date-input:focus { outline: none; border-color: var(--primary); }

  /* Stats dashboard */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stats-grid .stat-hero {
    grid-column: 1 / -1;
    text-align: center;
    padding: 16px 14px;
  }
  .stats-grid .stat-hero .stat-value {
    font-size: 40px;
    line-height: 1.1;
    margin: 4px 0;
  }
  .stat-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    border-top: 3px solid var(--border);
  }
  .stat-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
  .stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  /* Progress bar */
  .progress-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    margin-bottom: 12px;
    border-left: 4px solid var(--border);
  }
  .progress-bar-bg {
    height: 10px;
    background: var(--grey-bg);
    border-radius: 5px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.4s ease, background-color 0.3s;
  }
  .progress-label { font-size: 13px; font-weight: 600; }
  .progress-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .alert-banner {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alert-banner.warning { background: var(--red-bg); color: var(--red); }
  .alert-banner.success { background: var(--green-bg); color: var(--green); }

  /* Calendar */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .cal-title { font-size: 16px; font-weight: 700; }
  .cal-nav {
    display: flex;
    gap: 6px;
  }
  .cal-nav button {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 2px 6px rgba(220,7,20,0.2);
    transition: background 0.15s;
  }
  .cal-nav button:active { background: var(--primary-dark); }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    margin-bottom: 4px;
  }
  .cal-weekday {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 6px 0;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .cal-cell {
    aspect-ratio: 1 / 1.15;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3px 1px;
    font-size: 13px;
    font-weight: 600;
    position: relative;
    cursor: default;
    transition: transform 0.1s;
    min-height: 56px;
    overflow: hidden;
  }
  .cal-cell.empty { background: transparent; }
  .cal-cell.outside { opacity: 0.3; }
  .cal-cell.in-range { cursor: pointer; }
  .cal-cell.in-range:active { transform: scale(0.93); }

  .cal-date { font-size: 13px; line-height: 1.2; }
  .cal-cell.today .cal-date {
    background: var(--today-ring);
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cal-badge {
    font-size: 7px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    line-height: 1.3;
    margin-top: 1px;
  }
  .badge-start { background: var(--primary); color: white; }
  .badge-end { background: #f57c00; color: white; font-weight: 700; }

  .cal-status {
    font-size: 8px;
    font-weight: 600;
    margin-top: 1px;
    line-height: 1.2;
  }
  .status-2 { color: var(--green); }
  .status-1 { color: var(--amber); }
  .status-off { color: var(--grey); }
  .status-done { color: #999; font-size: 8px; }

  .cal-holiday {
    font-size: 9px;
    font-weight: 700;
    background: var(--holiday-pill);
    color: white;
    padding: 1px 4px;
    border-radius: 3px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 1px;
    max-width: 100%;
    text-align: center;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cal-cell.bg-green { background: var(--green-bg); }
  .cal-cell.bg-amber { background: var(--amber-bg); }
  .cal-cell.bg-off { background: var(--off-bg); }
  .cal-cell.bg-done { background: var(--grey-bg); opacity: 0.6; }
  .cal-cell.bg-override { box-shadow: inset 0 0 0 2px var(--primary); }

  /* Next month preview */
  .preview-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
  .preview .cal-cell { cursor: default !important; font-size: 11px; min-height: 48px; }
  .preview .cal-cell .cal-date { font-size: 11px; }
  .preview .cal-cell .cal-badge { font-size: 6px; }
  .preview .cal-cell .cal-status { font-size: 7px; }

function shortenEn(name) {
  return name
    .replace('Hong Kong Special Administrative Region Establishment Day', 'HKSAR Day')
    .replace('The first day of January', 'New Year')
    .replace('The day following the Chinese Mid-Autumn Festival', 'Mid-Autumn')
    .replace('The day following Chung Yeung Festival', 'Chung Yeung')
    .replace('The day following Ching Ming Festival', 'Ching Ming')
    .replace('The day following Easter Monday', 'Day after Easter Mon')
    .replace('The day following Good Friday', 'Day after Good Fri')
    .replace('The day following the Birthday of the Buddha', 'Buddha Birthday')
    .replace("Lunar New Year's Day", 'LNY Day 1')
    .replace('The second day of Lunar New Year', 'LNY Day 2')
    .replace('The third day of Lunar New Year', 'LNY Day 3')
    .replace('The fourth day of Lunar New Year', 'LNY Day 4')
    .replace('The first weekday after Christmas Day', 'Boxing Day')
    .replace('Christmas Day', 'Xmas Day')
    .replace('Ching Ming Festival', 'Ching Ming')
    .replace('Easter Monday', 'Easter Mon')
    .replace('Good Friday', 'Good Fri')
    .replace('Labour Day', 'Labour Day')
    .replace('The Birthday of the Buddha', 'Buddha Bday')
    .replace('Tuen Ng Festival', 'Tuen Ng')
    .replace('National Day', "Nat'l Day")
    .replace('Chung Yeung Festival', 'Chung Yeung');
}
function shortenZh(name) {
  return name
    .replace('一月一日', '元旦')
    .replace('農曆年初一', '年初一')
    .replace('農曆年初二', '年初二')
    .replace('農曆年初三', '年初三')
    .replace('農曆年初四', '年初四')
    .replace('香港特別行政區成立紀念日', '回歸紀念日')
    .replace('中秋節翌日', '中秋翌日')
    .replace('重陽節翌日', '重陽翌日')
    .replace('清明節翌日', '清明翌日')
    .replace('復活節星期一翌日', '復活節翌日')
    .replace('耶穌受難節翌日', '受難節翌日')
    .replace('佛誕翌日', '佛誕翌日')
    .replace('聖誕節後第一個周日', '聖誕翌日');
}
async function fetchHolidays() {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000);
  try {
    // Fetch both English and Chinese holiday names in parallel
    const [enResp, tcResp] = await Promise.all([
      fetch('https://www.1823.gov.hk/common/ical/en.json', { signal: controller.signal }),
      fetch('https://www.1823.gov.hk/common/ical/tc.json', { signal: controller.signal }),
    ]);
    clearTimeout(timeoutId);
    if (!enResp.ok) throw new Error('Failed to fetch holidays');
    const enJson = await enResp.json();
    const enEvents = enJson.vcalendar?.[0]?.vevent || [];
    // Build English map first
    const holidays = {};
    enEvents.forEach(ev => {
      const dtRaw = ev.dtstart?.[0];
      if (!dtRaw || dtRaw.length !== 8) return;
      const dateStr = `${dtRaw.slice(0, 4)}-${dtRaw.slice(4, 6)}-${dtRaw.slice(6, 8)}`;
      holidays[dateStr] = { en: shortenEn(ev.summary || 'Public Holiday'), zh: '' };
    });
    // Merge Chinese names
    if (tcResp.ok) {
      try {
        const tcJson = await tcResp.json();
        const tcEvents = tcJson.vcalendar?.[0]?.vevent || [];
        tcEvents.forEach(ev => {
          const dtRaw = ev.dtstart?.[0];
          if (!dtRaw || dtRaw.length !== 8) return;
          const dateStr = `${dtRaw.slice(0, 4)}-${dtRaw.slice(4, 6)}-${dtRaw.slice(6, 8)}`;
          const zhName = shortenZh(ev.summary || '公眾假期');
          if (holidays[dateStr]) {
            holidays[dateStr].zh = zhName;
          } else {
            holidays[dateStr] = { en: 'Public Holiday', zh: zhName };
          }
        });
      } catch(e) { console.warn('Failed to parse tc.json:', e); }
    }
    return holidays;
  } catch (e) {
    clearTimeout(timeoutId);
    throw e;
  }
}

function lookupFare(stationA, stationB) {
  if (!stationA || !stationB || stationA === stationB) return null;
  const key = [stationA, stationB].sort().join('|');
  return FARE_MAP[key] || null;
}

// (Language is accessed via useLang() hook in components, and I18N[lang] for labels)

async function fetchNextTrain(stationName) {
  const entries = NEXT_TRAIN_MAP[stationName];
  if (!entries || entries.length === 0) return null;

  const results = await Promise.all(entries.map(async (info) => {
    try {
      const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${info.line}&sta=${info.sta}`;
      const resp = await fetch(url);
      if (!resp.ok) return { line: info.line, error: `HTTP ${resp.status}` };
      const data = await resp.json();
      if (data.status === 0) return { line: info.line, error: 'Service disruption on ' + (LINE_NAMES[info.line] || info.line) };
      const key = `${info.line}-${info.sta}`;
      const schedule = data.data?.[key];
      if (!schedule) return { line: info.line, error: 'No schedule data' };
      const trains = [];
      ['UP', 'DOWN'].forEach(dir => {
        if (schedule[dir]) {
          schedule[dir].forEach(t => {
            trains.push({
              line: info.line,
              dest: DEST_NAMES[t.dest] || t.dest,
              destCode: t.dest,
              ttnt: t.ttnt,
              time: t.time,
              plat: t.plat,
              dir
            });
          });
        }
      });
      return { line: info.line, trains, timestamp: data.sys_time };
    } catch (e) {
      return {
        line: info.line,
        error: e.name === 'TypeError' ? 'Cannot reach MTR server — check your internet or try again' : (e.message || 'Unknown error')
      };
    }
  }));
  return results;
}

    } else {

      if (s.cs) ALL_STATIONS_MAP[key].cs = true;

    }
  });
});

// ─── MTR Network Graph & Fare Estimation ───
// Build adjacency graph from line data (consecutive stations are connected)
const MTR_GRAPH = (() => {
  const graph = {};
  MTR_LINES.forEach(({ stations }) => {
    for (let i = 0; i < stations.length; i++) {
      const name = stations[i].en;
      if (!graph[name]) graph[name] = new Set();
      if (i > 0) {
        const prev = stations[i - 1].en;
        graph[name].add(prev);
        if (!graph[prev]) graph[prev] = new Set();
        graph[prev].add(name);
      }
    }
  });
  // Add walking interchange connections (same physical station, different names)
  const interchanges = [
    ['Tsim Sha Tsui', 'East Tsim Sha Tsui'],  // TST ↔ East TST walkway
  ];
  interchanges.forEach(([a, b]) => {
    if (graph[a] && graph[b]) {
      graph[a].add(b);
      graph[b].add(a);
    }
  });

  return graph;
})();

// BFS shortest path (number of stops) between two stations
function bfsDistance(from, to) {
  if (from === to) return 0;
  if (!MTR_GRAPH[from] || !MTR_GRAPH[to]) return -1;
  const visited = new Set([from]);
  const queue = [[from, 0]];
  while (queue.length > 0) {
    const [node, dist] = queue.shift();
    for (const neighbor of MTR_GRAPH[node]) {
      if (neighbor === to) return dist + 1;
      if (!visited.has(neighbor)) {
        visited.add(neighbor);
        queue.push([neighbor, dist + 1]);
      }
    }
  }
  return -1;
}

// ─── Split-Journey Fare Finder ───
// For journeys involving non-designated stations, find the cheapest
// way to split at designated station(s) to use City Saver for part of the trip.
// Returns { splitStation, fareOutside, fareInside, totalPerTrip, directFare } or null
const DESIGNATED_STATIONS = Object.keys(ALL_STATIONS_MAP).filter(k => ALL_STATIONS_MAP[k].cs);
const CS_PER_TRIP = 460 / 40; // $11.5

function findBestSplit(origin, dest) {
  if (!origin || !dest || origin === dest) return null;
  const originCS = ALL_STATIONS_MAP[origin]?.cs;
  const destCS = ALL_STATIONS_MAP[dest]?.cs;
  const directFare = lookupFare(origin, dest);

  if (originCS && destCS) return null; // both designated — no split needed
  if (!originCS && !destCS) return null; // both non-designated — no City Saver benefit

  const results = [];

  if (!originCS && destCS) {
    // Origin is non-designated, dest is designated
    // Split: origin → splitStation (pay fare) + splitStation → dest (City Saver, free)
    for (const sp of DESIGNATED_STATIONS) {
      if (sp === dest) continue;
      const fareOut = lookupFare(origin, sp);
      if (fareOut === null) continue;
      results.push({ splitStations: [sp], fareLegs: [fareOut], csLeg: `${sp} → ${dest}`, totalPerTrip: CS_PER_TRIP + fareOut, paidFare: fareOut, type: 'one-split' });
    }
  } else if (originCS && !destCS) {
    // Origin is designated, dest is non-designated
    // Split: origin → splitStation (City Saver) + splitStation → dest (pay fare)
    for (const sp of DESIGNATED_STATIONS) {
      if (sp === origin) continue;
      const fareOut = lookupFare(sp, dest);
      if (fareOut === null) continue;
      results.push({ splitStations: [sp], fareLegs: [fareOut], csLeg: `${origin} → ${sp}`, totalPerTrip: CS_PER_TRIP + fareOut, paidFare: fareOut, type: 'one-split' });
    }
  }

  if (results.length === 0) return null;

  // Sort by total per-trip cost
  results.sort((a, b) => a.totalPerTrip - b.totalPerTrip);

  const best = results[0];
  best.directFare = directFare;
  best.originCS = originCS;
  best.destCS = destCS;
  return best;
}

// ─── Storage sanitizers (skip malformed records instead of crashing the page) ───
const DATE_KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
function sanitizeDateNumMap(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
  const out = {};
  for (const k in raw) {
    if (!DATE_KEY_RE.test(k)) continue;
    const v = Number(raw[k]);
    if (Number.isFinite(v) && v >= 0 && v <= 10) out[k] = v;
  }
  return out;
}
function sanitizeDateStrMap(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
  const out = {};
  for (const k in raw) {
    if (!DATE_KEY_RE.test(k)) continue;
    const v = raw[k];
    if (typeof v === 'string' && v.length > 0 && v.length <= 500) out[k] = v;
  }
  return out;
}
function sanitizeHistory(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.filter(r =>
    r && typeof r === 'object' &&
    (typeof r.id === 'number' || typeof r.id === 'string') &&
    Number.isFinite(Number(r.ridesUsed))
  ).map(r => ({ ...r, ridesUsed: Number(r.ridesUsed) }));
}
function readJSON(key, fallback) {
  try {
    const s = localStorage.getItem(key);
    if (!s) return fallback;
    return JSON.parse(s);
  } catch { return fallback; }
}

// ─── Utilities ───
function dateToStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function computeRidesForDate(date, workMode, customDays, holidays, overrides, startDate, endDate) {
  if (!startDate || !endDate) return { rides: 0, status: 'off' };
  const ds = dateToStr(date);
  if (overrides && overrides[ds] !== undefined && overrides[ds] !== 'auto') {
    const ov = overrides[ds];
    if (typeof ov === 'number' && ov >= 2) return { rides: ov, status: '2', overridden: true };
    if (ov === 1) return { rides: 1, status: '1', overridden: true };
    if (ov === 0) return { rides: 0, status: 'off', overridden: true };
  }
  if (date < startDate || date > endDate) return { rides: 0, status: 'off' };
  const dow = date.getDay();
  if (holidays && holidays[ds]) return { rides: 0, status: 'off' };
  if (workMode === 'office') return (dow >= 1 && dow <= 5) ? { rides: 2, status: '2' } : { rides: 0, status: 'off' };
  if (workMode === 'service') return (dow >= 1 && dow <= 6) ? { rides: 2, status: '2' } : { rides: 0, status: 'off' };
  const days = customDays || { 1: true, 2: true, 3: true, 4: true, 5: true, 6: false, 0: false };
  return days[dow] ? { rides: 2, status: '2' } : { rides: 0, status: 'off' };
}

function todayDate() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate());
}

// ─── Main App ───
function App({ onArchive }) {
  const lang = useLang();

    try { const s = localStorage.getItem('mtr-cs-customDays'); return s ? JSON.parse(s) : { 1: true, 2: true, 3: true, 4: true, 5: true, 6: false, 0: false }; } catch { return { 1: true, 2: true, 3: true, 4: true, 5: true, 6: false, 0: false }; }

  const [promptModal, setPromptModal] = useState(null);

  React.useEffect(() => {

  const confirmArchive = () => {

      const ridesUsed = stats ? 40 - stats.ridesLeft : 0;
      const fare = parseFloat(octopusFare) || 0;

      onArchive({
        startDate: startDateStr,
        endDate: todayStr,
        ridesUsed,
        ridesWasted: stats ? stats.ridesLeft : 0,
        completed: stats ? stats.ridesLeft === 0 : false,
        workMode,
        customDays: { ...customDays },
        holidayType,
        weekStart,
        overrides: { ...overrides },
        notes: { ...notes },
        holidays: { ...holidays },
        quotaMap: stats ? { ...stats.quotaMap } : {},
        octopusFare: fare,
        totalSavings,

    setOverrides({});
    setNotes({});
    setArchiveModal(false);

  const [originStation, setOriginStation] = useState(() => {
    try { return localStorage.getItem('mtr-cs-originStation') || ''; } catch { return ''; }
  });
  const [destStation, setDestStation] = useState(() => {
    try { return localStorage.getItem('mtr-cs-destStation') || ''; } catch { return ''; }
  });
  const [octopusFare, setOctopusFare] = useState(() => {
    try { return localStorage.getItem('mtr-cs-octopusFare') || ''; } catch { return ''; }
  });
  useEffect(() => {
    try {
      localStorage.setItem('mtr-cs-workMode', workMode);
      localStorage.setItem('mtr-cs-customDays', JSON.stringify(customDays));
      localStorage.setItem('mtr-cs-holidayType', holidayType);
      localStorage.setItem('mtr-cs-startDateStr', startDateStr);
      localStorage.setItem('mtr-cs-weekStart', weekStart);
      localStorage.setItem('mtr-cs-overrides', JSON.stringify(overrides));
      localStorage.setItem('mtr-cs-notes', JSON.stringify(notes));
      localStorage.setItem('mtr-cs-originStation', originStation);
      localStorage.setItem('mtr-cs-destStation', destStation);
      localStorage.setItem('mtr-cs-octopusFare', octopusFare);
    } catch {}
  }, [workMode, customDays, holidayType, startDateStr, weekStart, overrides, notes, originStation, destStation, octopusFare]);

    } catch { return { purchased: false, registered: false, verified: false, purchaseDate: '' }; }

  useEffect(() => {

  const toggleReg = (key) => setRegChecklist(prev => ({ ...prev, [key]: !prev[key] }));
  const setRegDate = (val) => setRegChecklist(prev => ({ ...prev, purchaseDate: val }));
  const allRegDone = regChecklist.purchased && regChecklist.registered && regChecklist.verified;
  const [regExpanded, setRegExpanded] = useState(!allRegDone);

  const regDeadline = useMemo(() => {

    const [y, m, d] = regChecklist.purchaseDate.split('-').map(Number);
    return addDays(new Date(y, m - 1, d), 30);
  }, [regChecklist.purchaseDate]);
  const regDaysLeft = useMemo(() => {
    if (!regDeadline) return null;
    const today = todayDate();
    const diff = Math.ceil((regDeadline - today) / (1000 * 60 * 60 * 24));

  }, [regDeadline]);

      if (holidayType === 'general') return apiHolidays;
      // Statutory (2026): 15 days = General minus Good Friday and Day after Easter Monday
      // Easter Monday is statutory from 2026, Boxing Day from 2024 — keep both
      // Christmas Day is the default statutory choice (not adding Winter Solstice)
      const stat = { ...apiHolidays };
      Object.keys(stat).forEach(d => {
        const name = (typeof stat[d] === 'string' ? stat[d] : stat[d].en || '').toLowerCase();

          delete stat[d];

      statHols = stat;

  // Sync view when start date changes

  const stopsCount = useMemo(() => {
    if (originStation && destStation && originStation !== destStation) {
      return bfsDistance(originStation, destStation);

    return -1;
  }, [originStation, destStation]);

  // Auto-lookup fare from embedded data when stations change
  useEffect(() => {
    if (!originStation || !destStation || originStation === destStation) {
      setOctopusFare('');

    }
    const fare = lookupFare(originStation, destStation);
    setOctopusFare(fare ? String(fare) : '');

  const navPrev = () => {
    if (viewMonth === 0) { setViewYear(viewYear - 1); setViewMonth(11); }
    else setViewMonth(viewMonth - 1);
  };
  const navNext = () => {
    if (viewMonth === 11) { setViewYear(viewYear + 1); setViewMonth(0); }
    else setViewMonth(viewMonth + 1);
  };
  const navToday = () => {
    const now = todayDate();
    setViewYear(now.getFullYear());
    setViewMonth(now.getMonth());
  };
  const nextPreviewMonth = viewMonth === 11 ? 0 : viewMonth + 1;
  const nextPreviewYear = viewMonth === 11 ? viewYear + 1 : viewYear;

  const endDate = useMemo(() => startDate ? addDays(startDate, 39) : null, [startDate]);

  // Calculate rides for a given date
  const getRidesForDate = useCallback((date) => {
    return computeRidesForDate(date, workMode, customDays, holidays, overrides, startDate, endDate);
  }, [startDate, endDate, workMode, holidays, overrides, customDays]);

  // Full simulation — tracks quota exhaustion per day
  const stats = useMemo(() => {
    if (!startDate || !endDate) return null;
    let ridesLeft = 40;
    let finishDay = null;
    let finishDate = null;
    // Map dateStr -> effective rides after quota cap
    const quotaMap = {};

    for (let i = 0; i < 40; i++) {
      const d = addDays(startDate, i);
      const ds = dateToStr(d);
      const { rides } = getRidesForDate(d);
      const deduct = Math.min(rides, ridesLeft);
      quotaMap[ds] = deduct; // actual rides consumed (0 if quota already done)
      ridesLeft -= deduct;
      if (ridesLeft === 0 && finishDay === null) {
        finishDay = i + 1; // day number (1-indexed)
        finishDate = d;
      }
    }

    const expired = ridesLeft > 0;
    let speedColor = 'green';
    if (finishDay) {
      if (finishDay > 38) speedColor = 'red';
      else if (finishDay > 30) speedColor = 'orange';
    } else if (expired) {
      speedColor = 'red';
    }

    return { ridesLeft, finishDay, finishDate, expired, speedColor, quotaMap };
  }, [startDate, endDate, getRidesForDate]);

  // Handle cell tap — cycle override (Auto → 2 → 1 → OFF → Auto)
  const handleCellTap = useCallback((dateStr) => {
    setOverrides(prev => {
      const current = prev[dateStr];
      let next;
      if (current === undefined || current === 'auto') next = 2;
      else if (current === 2) next = 1;
      else if (current === 1) next = 0;
      else next = 'auto';

      const newOv = { ...prev };
      if (next === 'auto') delete newOv[dateStr];
      else newOv[dateStr] = next;
      return newOv;
    });
  }, []);

  // Handle long-press — open custom modal for trip count (replaces window.prompt for in-app browser compatibility)
  const handleCellLongPress = useCallback((dateStr) => {
    const currentNote = notes[dateStr] || '';
    const currentOverride = overrides[dateStr];
    setPromptModal({
      message: lang === 'zh' ? `設定 ${dateStr}` : `Set ${dateStr}`,

      note: currentNote,
      hasNote: true,
      onConfirm: (val, noteVal) => {
        const num = parseInt(val, 10);
        if (!isNaN(num) && num >= 0) {
          setOverrides(prev => {
            const newOv = { ...prev };
            if (num === 0) { newOv[dateStr] = 0; }
            else { newOv[dateStr] = num; }
            return newOv;
          });
        }
        setNotes(prev => {
          const newNotes = { ...prev };
          if (noteVal && noteVal.trim()) newNotes[dateStr] = noteVal.trim();
          else delete newNotes[dateStr];
          return newNotes;
        });
        setPromptModal(null);
      },

    });
  }, [lang, notes, overrides]);

              type="number"
              className="prompt-trips-input"
              defaultValue={promptModal.defaultValue}
              min="0"
              max="10"
              autoFocus
              onKeyDown={e => {
                if (e.key === 'Enter') {
                  const noteEl = document.querySelector('.prompt-note-input');
                  promptModal.onConfirm(e.target.value, noteEl ? noteEl.value : '');
                }
              }}
              ref={el => el && el.focus()}
            />
            {promptModal.hasNote && (
              <>
                <div style={{ fontSize: 12, color: 'var(--text-secondary)', marginBottom: 6 }}>
                  {lang === 'zh' ? '備注（可選）' : 'Note (optional)'}
                </div>
                <input
                  type="text"

                  defaultValue={promptModal.note || ''}
                  placeholder={lang === 'zh' ? '如：公幹、探親、請假' : 'e.g. business trip, leave'}
                  style={{ marginBottom: 16 }}
                  onKeyDown={e => {
                    if (e.key === 'Enter') {
                      const tripsEl = document.querySelector('.prompt-trips-input');

                    }
                  }}

            )}

              <button className="prompt-modal-cancel" onClick={() => promptModal.onCancel()}>

              <button className="prompt-modal-confirm" onClick={() => {

                promptModal.onConfirm(inp ? inp.value : '0', noteEl ? noteEl.value : '');
              }}>
                {lang === 'zh' ? '確定' : 'OK'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Calendar Month Component ───
function CalendarMonth({ year, month, startDate, endDate, weekStart, holidays, getRidesForDate, overrides, notes, onCellTap, onCellLongPress, showNav, onPrev, onNext, onToday, quotaMap }) {
  const lang = useLang();
  const L = I18N[lang] || I18N.en;
  const monthNamesEn = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const monthNamesZh = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
  const monthNames = lang === 'zh' ? monthNamesZh : monthNamesEn;
  const weekdaysSun = lang === 'zh' ? ['日', '一', '二', '三', '四', '五', '六'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const weekdaysMon = lang === 'zh' ? ['一', '二', '三', '四', '五', '六', '日'] : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const weekdays = weekStart === 'mon' ? weekdaysMon : weekdaysSun;

  // Long-press detection
  const longPressTimer = React.useRef(null);
  const longPressTriggered = React.useRef(false);
  const handleTouchStart = (ds) => {
    longPressTriggered.current = false;
    longPressTimer.current = setTimeout(() => {
      longPressTriggered.current = true;
      if (onCellLongPress) onCellLongPress(ds);
    }, 500);
  };
  const handleTouchEnd = () => {
    clearTimeout(longPressTimer.current);
  };
  const handleClick = (ds, inRange) => {
    if (longPressTriggered.current) { longPressTriggered.current = false; return; }
    if (inRange && onCellTap) onCellTap(ds);
  };

  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let startDow = firstDay.getDay(); // 0=Sun
  if (weekStart === 'mon') {
    startDow = (startDow + 6) % 7; // shift so Mon=0
  }

  const today = todayDate();

  const cells = [];
  // Empty cells before first day
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  return (
    <div className="card">
      <div className="cal-header">
        {showNav ? (
          <>
            <div className="cal-nav"><button onClick={onPrev}>‹</button></div>
            <div className="cal-title">{monthNames[month]} {year}</div>
            <div className="cal-nav"><button onClick={onNext}>›</button></div>
          </>
        ) : (
          <div className="cal-title">{monthNames[month]} {year}</div>
        )}
      </div>
      {onToday && (year !== today.getFullYear() || month !== today.getMonth()) && (
        <div style={{ textAlign: 'center', marginBottom: 6 }}>
          <button onClick={onToday} style={{ fontSize: 11, padding: '2px 12px', borderRadius: 12, border: '1px solid var(--border)', background: 'var(--input-bg)', color: 'var(--text-secondary)', cursor: 'pointer', fontWeight: 600 }}>
            {lang === 'zh' ? '返回今日' : 'Back to Today'}
          </button>
        </div>
      )}

      <div className="cal-weekdays">
        {weekdays.map(d => <div key={d} className="cal-weekday">{d}</div>)}
      </div>

      <div className="cal-grid">
        {cells.map((day, idx) => {
          if (day === null) return <div key={`e-${idx}`} className="cal-cell empty" />;

          const date = new Date(year, month, day);
          const ds = dateToStr(date);
          const isStart = startDate && sameDay(date, startDate);
          const isEnd = endDate && sameDay(date, endDate);
          const inRange = startDate && endDate && date >= startDate && date <= endDate;
          const isToday = sameDay(date, today);
          const holidayObj = holidays[ds] || null;
          const holidayName = holidayObj ? (lang === 'zh' ? (holidayObj.zh || holidayObj.en) : holidayObj.en) : null;

          const { rides, status, overridden } = inRange ? getRidesForDate(date) : { rides: 0, status: 'off', overridden: false };
          const hasOverride = overrides[ds] !== undefined && overrides[ds] !== 'auto';

          // Use quotaMap to determine effective rides (respects 40-ride cap)
          const effectiveRides = (inRange && quotaMap && quotaMap[ds] !== undefined) ? quotaMap[ds] : rides;
          const isExhausted = inRange && quotaMap && quotaMap[ds] !== undefined && quotaMap[ds] === 0 && rides > 0;
          const effectiveStatus = isExhausted ? 'done' : (effectiveRides >= 2 ? '2' : effectiveRides === 1 ? '1' : status);

          let bgClass = '';
          if (inRange) {
            if (isExhausted) bgClass = 'bg-done';
            else if (effectiveStatus === '2') bgClass = 'bg-green';
            else if (effectiveStatus === '1') bgClass = 'bg-amber';
            else bgClass = 'bg-off';
          }

          return (
            <div
              key={ds}
              className={`cal-cell ${bgClass} ${inRange ? 'in-range' : ''} ${isToday ? 'today' : ''} ${!inRange ? 'outside' : ''} ${hasOverride ? 'bg-override' : ''}`}
              onClick={() => handleClick(ds, inRange)}
              onTouchStart={() => inRange ? handleTouchStart(ds) : null}
              onTouchEnd={handleTouchEnd}
              onContextMenu={(e) => { if (inRange && onCellLongPress) { e.preventDefault(); onCellLongPress(ds); }}}
            >
              {hasOverride && <div className="override-dot" />}
              <div className="cal-date">
                {isToday ? <span>{day}</span> : day}
              </div>
              {inRange && isExhausted && <div className="cal-status status-done">{L.noQuota}</div>}
              {inRange && !isExhausted && effectiveRides >= 2 && <div className="cal-status status-2">{effectiveRides > 2 ? `${effectiveRides}${lang === 'zh' ? '程' : ' trips'}` : L.twoTrips.split('（')[0].split('(')[0].trim()}</div>}
              {inRange && !isExhausted && effectiveRides === 1 && <div className="cal-status status-1">{L.oneTrip}</div>}
              {inRange && !isExhausted && effectiveRides === 0 && effectiveStatus === 'off' && <div className="cal-status status-off">OFF</div>}
              {isStart && <div className="cal-badge badge-start">{lang === 'zh' ? '開始' : 'START'}</div>}
              {isEnd && <div className="cal-badge badge-end">{lang === 'zh' ? '到期' : 'EXPIRY'}</div>}
              {holidayName && <div className="cal-holiday" title={holidayName}>{holidayName}</div>}
              {notes && notes[ds] && <div className="cal-holiday" style={{ color: 'var(--amber)', fontStyle: 'italic' }} title={notes[ds]}>{notes[ds]}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Station Coverage Component ───
function StationCoverage() {
  const lang = useLang();
  const isZh = lang === 'zh';
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all'); // all, covered, not-covered

  const totalStations = Object.keys(ALL_STATIONS_MAP).length;
  const coveredStations = Object.values(ALL_STATIONS_MAP).filter(s => s.cs).length;

  const filteredLines = useMemo(() => {
    const searchLower = search.toLowerCase();
    return MTR_LINES
      .filter(l => l.line !== 'Airport Express' && l.line !== 'Disneyland Resort Line')
      .map(({ line, color, stations }) => {
        const filtered = stations.filter(s => {
          const matchSearch = !search || s.en.toLowerCase().includes(searchLower) || s.zh.includes(search);
          const matchFilter = filter === 'all' || (filter === 'covered' && s.cs) || (filter === 'not-covered' && !s.cs);
          return matchSearch && matchFilter;
        });
        return { line, color, stations: filtered };
      })
      .filter(l => l.stations.length > 0);
  }, [search, filter]);

  return (
    <div>
      <div className="coverage-page">
        <div className="coverage-summary">
          <div className="coverage-stat">
            <div className="cs-num" style={{ color: 'var(--green)' }}>{coveredStations}</div>
            <div className="cs-label">{isZh ? '適用車站' : 'Covered Stations'}</div>
          </div>
          <div className="coverage-stat">
            <div className="cs-num" style={{ color: 'var(--grey)' }}>{totalStations - coveredStations}</div>
            <div className="cs-label">{isZh ? '不適用' : 'Not Covered'}</div>
          </div>
        </div>

        <div className="search-wrapper">
          <span className="search-icon">🔍</span>
          <input
            className="search-input"
            style={{ paddingLeft: 36 }}
            placeholder={isZh ? '搜尋車站名稱...' : 'Search station name...'}
            value={search}
            onChange={e => setSearch(e.target.value)}
          />
        </div>

        <div className="filter-row">
          <button className={`filter-chip ${filter === 'all' ? 'active' : ''}`} onClick={() => setFilter('all')}>{isZh ? '全部' : 'All'}</button>
          <button className={`filter-chip ${filter === 'covered' ? 'active' : ''}`} onClick={() => setFilter('covered')}>{isZh ? '適用' : 'Covered'}</button>
          <button className={`filter-chip ${filter === 'not-covered' ? 'active' : ''}`} onClick={() => setFilter('not-covered')}>{isZh ? '不適用' : 'Not Covered'}</button>
        </div>

        {filteredLines.map(({ line, color, stations }) => (
          <div key={line} className="line-group">
            <div className="line-header">
              <div className="line-dot" style={{ background: color }} />
              <span>{isZh ? (LINE_DISPLAY_ZH[line] || line) : line}</span>
              <span className="line-count">

// Probes one station per line to check service status
const STATUS_PROBES = [
  { line: 'AEL', sta: 'HOK', label: 'Airport Express' },
  { line: 'TCL', sta: 'HOK', label: 'Tung Chung Line' },
  { line: 'TML', sta: 'HUH', label: 'Tuen Ma Line' },
  { line: 'TKL', sta: 'TKO', label: 'Tseung Kwan O Line' },
  { line: 'EAL', sta: 'SHT', label: 'East Rail Line' },
  { line: 'SIL', sta: 'ADM', label: 'South Island Line' },
  { line: 'TWL', sta: 'TSW', label: 'Tsuen Wan Line' },
  { line: 'ISL', sta: 'ADM', label: 'Island Line' },
  { line: 'KTL', sta: 'MOK', label: 'Kwun Tong Line' },
];

function MtrServiceStatus() {
  const lang = useLang();
  const L = I18N[lang] || I18N.en;
  const isZh = lang === 'zh';
  const [lineStatus, setLineStatus] = useState(null);
  const [checking, setChecking] = useState(false);
  const [expanded, setExpanded] = useState(false);

  const checkStatus = useCallback(async () => {
    setChecking(true);
    const results = {};
    await Promise.all(STATUS_PROBES.map(async (probe) => {
      try {
        const url = `https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${probe.line}&sta=${probe.sta}`;
        const resp = await fetch(url);
        if (!resp.ok) { results[probe.line] = 'unknown'; return; }
        const data = await resp.json();
        if (data.status === 0) {
          results[probe.line] = 'disruption';
        } else {
          const key = `${probe.line}-${probe.sta}`;
          const schedule = data.data?.[key];
          if (schedule && data.isdelay === 'Y') {
            results[probe.line] = 'delay';
          } else {
            results[probe.line] = 'normal';
          }
        }
      } catch {
        results[probe.line] = 'unknown';
      }
    }));
    setLineStatus(results);
    setChecking(false);
  }, []);

  useEffect(() => { checkStatus(); const iv = setInterval(checkStatus, 60000); return () => clearInterval(iv); }, [checkStatus]);

  const hasIssues = lineStatus && Object.values(lineStatus).some(s => s !== 'normal');

  const statusIcon = (s) => s === 'normal' ? '✅' : s === 'delay' ? '⚠️' : s === 'disruption' ? '🔴' : '❓';
  const statusText = (s) => s === 'normal' ? L.normal : s === 'delay' ? L.delay : s === 'disruption' ? L.disruption : '?';
  const statusColor = (s) => s === 'normal' ? 'var(--green-text)' : s === 'delay' ? 'var(--amber-text)' : s === 'disruption' ? 'var(--red-text)' : 'var(--text-secondary)';

  return (
    <div style={{ margin: '0 12px 8px', borderRadius: 10, overflow: 'hidden', border: '1px solid var(--border)' }}>
      <div
        onClick={() => setExpanded(!expanded)}
        style={{
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '8px 12px', cursor: 'pointer',
          background: !lineStatus ? 'var(--bg)' : hasIssues ? 'var(--amber-bg)' : 'var(--green-bg)'
        }}
      >
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 600 }}>
          <span>{!lineStatus ? '⏳' : hasIssues ? '⚠️' : '✅'}</span>
          <span style={{ color: !lineStatus ? 'var(--text-secondary)' : hasIssues ? 'var(--amber-text)' : 'var(--green-text)' }}>
            {!lineStatus ? L.checking : hasIssues
              ? (isZh ? '部分路綫服務受影響' : 'Some lines affected')
              : L.allNormal}
          </span>
        </div>
        <span style={{ fontSize: 10, color: 'var(--text-secondary)', transform: expanded ? 'rotate(180deg)' : 'rotate(0)', transition: 'transform .2s' }}>▼</span>
      </div>
      {expanded && lineStatus && (
        <div style={{ padding: '6px 12px 10px', background: 'var(--card)' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '4px 12px' }}>
            {STATUS_PROBES.map(probe => {
              const s = lineStatus[probe.line] || 'unknown';
              return (
                <div key={probe.line} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '3px 0', fontSize: 12 }}>
                  <span style={{ width: 8, height: 8, borderRadius: '50%', background: LINE_COLORS[probe.line] || '#999', display: 'inline-block', flexShrink: 0 }} />
                  <span style={{ flex: 1, color: 'var(--text)' }}>{isZh ? (LINE_NAMES_ZH[probe.line] || probe.label) : probe.label}</span>
                  <span style={{ fontSize: 11, color: statusColor(s), fontWeight: s !== 'normal' ? 700 : 400 }}>
                    {statusIcon(s)} {statusText(s)}
                  </span>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 6, textAlign: 'right' }}>
            <button
              onClick={(e) => { e.stopPropagation(); checkStatus(); }}
              disabled={checking}
              style={{ fontSize: 10, color: 'var(--text-secondary)', background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline' }}
            >
              {checking ? L.checking : (isZh ? '重新檢查' : 'Refresh')}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function FavouriteQuickCard({ favourites, trainCache, onRefresh, onNavigate }) {
  const lang = useLang();
  const L = I18N[lang] || I18N.en;
  const isZh = lang === 'zh';

  useEffect(() => {
    if (favourites.length > 0) onRefresh(favourites);
  }, [favourites.length]);

  if (favourites.length === 0) return null;

  const destName = (code) => isZh ? (DEST_NAMES_ZH[code] || DEST_NAMES[code] || code) : (DEST_NAMES[code] || code);

  return (
    <div className="section" style={{ paddingBottom: 4, paddingTop: 12 }}>
      <div className="card fav-quick-card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>

          </div>
          <button onClick={() => onRefresh(favourites)} style={{
            background: 'none', border: 'none', color: 'var(--primary)',
            fontSize: 12, fontWeight: 700, cursor: 'pointer', padding: '2px 4px'
          }}>↻ {L.favRefresh}</button>
        </div>

        {favourites.map((stationEn) => {
          const cache = trainCache[stationEn];
          const stationZh = STATION_ZH[stationEn] || stationEn;
          const nextTrains = [];

          if (cache && cache.results) {
            cache.results.forEach(r => {
              if (r.error || !r.trains) return;
              const upFirst = r.trains.filter(t => t.dir === 'UP').sort((a,b) => (parseInt(a.ttnt)||999) - (parseInt(b.ttnt)||999))[0];
              const downFirst = r.trains.filter(t => t.dir === 'DOWN').sort((a,b) => (parseInt(a.ttnt)||999) - (parseInt(b.ttnt)||999))[0];
              [upFirst, downFirst].filter(Boolean).forEach(t => {
                const mins = parseInt(t.ttnt);
                nextTrains.push({
                  line: r.line,
                  dest: destName(t.destCode),
                  time: mins <= 0 ? (isZh ? '即將' : 'Now') : `${t.ttnt}${isZh ? '分' : 'm'}`,
                  color: LINE_COLORS[r.line] || '#999'

                    <span key={i} className="fav-train-chip" style={{ borderLeft: `3px solid ${t.color}` }}>
                      → {t.dest} {t.time}
                    </span>
                  ))
                }
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function NextTrainPage({ favourites, toggleFavourite, initialStation, onStationConsumed }) {
  const lang = useLang();
  const L = I18N[lang] || I18N.en;
  const isZh = lang === 'zh';
  const [station, setStation] = useState('');

  useEffect(() => {
    if (initialStation) {
      setStation(initialStation);
      if (onStationConsumed) onStationConsumed();
    }
  }, [initialStation]);
  const [trainData, setTrainData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [lastUpdated, setLastUpdated] = useState(null);
  const [countdown, setCountdown] = useState(30);
  const countdownRef = useRef(null);
  const refreshRef = useRef(null);
  // Monotonic request token — incremented whenever station changes or a new
  // fetch starts. Late-arriving responses compare their token to the current
  // one and drop themselves if stale, preventing a slow previous-station
  // response from overwriting fresh data.
  const requestTokenRef = useRef(0);

  // Auto-refresh every 30 seconds when train data is showing
  const hasData = !!trainData;
  useEffect(() => {
    if (!hasData || !station) {
      clearInterval(countdownRef.current);
      clearInterval(refreshRef.current);
      setCountdown(30);
      return;
    }
    setCountdown(30);
    countdownRef.current = setInterval(() => {
      setCountdown(prev => {
        if (prev <= 1) return 30;
        return prev - 1;
      });
    }, 1000);
    refreshRef.current = setInterval(async () => {
      if (document.hidden) return;
      const token = ++requestTokenRef.current;
      try {
        const results = await fetchNextTrain(station);
        if (requestTokenRef.current !== token) return;
        setTrainData(results);
        setLastUpdated(new Date());
      } catch (_) {}
      setCountdown(30);
    }, 30000);
    return () => {
      clearInterval(countdownRef.current);
      clearInterval(refreshRef.current);
    };
  }, [hasData, station]);

  const stationDisplay = (en) => isZh ? (STATION_ZH[en] || en) : en;
  const lineDisplay = (code) => isZh ? (LINE_NAMES_ZH[code] || LINE_NAMES[code] || code) : (LINE_NAMES[code] || code);
  const destDisplay = (code) => isZh ? (DEST_NAMES_ZH[code] || DEST_NAMES[code] || code) : (DEST_NAMES[code] || code);
  const lineGroupLabel = (lineName) => {
    if (!isZh) return lineName;
    // Find matching zh line name from MTR_LINES
    const found = MTR_LINES.find(l => l.line === lineName);
    if (!found) return lineName;
    // Try to match via line code
    for (const [code, enName] of Object.entries(LINE_NAMES)) {
      if (lineName.toLowerCase().replace(/\s+/g, '').includes(enName.toLowerCase().replace(/\s+/g, '')) ||
          enName.toLowerCase().replace(/\s+/g, '').includes(lineName.toLowerCase().replace(/\s+/g, ''))) {
        return LINE_NAMES_ZH[code] || lineName;
      }
    }
    return lineName;
  };

  const handleCheck = useCallback(async () => {
    if (!station) return;
    const token = ++requestTokenRef.current;
    setLoading(true);
    setError(null);
    setTrainData(null);
    try {
      const results = await fetchNextTrain(station);
      if (requestTokenRef.current !== token) return;
      setTrainData(results);
      setLastUpdated(new Date());
    } catch (e) {
      if (requestTokenRef.current !== token) return;
      setError(e.message || 'Failed to fetch');
    }
    if (requestTokenRef.current !== token) return;
    setLoading(false);
  }, [station]);

  return (
    <div>
      <div className="header">
        <div className="header-accent" />
        <div className="header-inner" style={{ position: 'relative' }}>
          <div className="header-logo">🚇</div>
          <div>
            <h1>{L.nextTrain}</h1>
            <div className="subtitle">{L.nextTrainSubtitle}</div>
          </div>
        </div>
      </div>

      <MtrServiceStatus />

      <div className="section">
        <div className="card">
          <div className="field-row">
            <div className="field-label">{L.selectStation}</div>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <select
                className="station-select"
                style={{ flex: 1 }}
                value={station}
                onChange={e => { requestTokenRef.current++; setStation(e.target.value); setTrainData(null); }}
              >
                <option value="">{L.selectStationPlaceholder}</option>
                {MTR_LINES.map(({ line, stations }) => (
                  <optgroup key={line} label={lineGroupLabel(line)}>
                    {stations.filter(s => NEXT_TRAIN_MAP[s.en]).map(s => (
                      <option key={`${line}-${s.en}`} value={s.en}>
                        {isZh ? `${s.zh} ${s.en}` : s.en}
                      </option>
                    ))}
                  </optgroup>
                ))}
              </select>
              {station && toggleFavourite && (
                <button
                  className={`star-btn ${favourites && favourites.includes(station) ? 'starred' : ''}`}
                  onClick={() => toggleFavourite(station)}
                  title={favourites && favourites.includes(station) ? L.removeFavourite : L.addFavourite}
                >
                  {favourites && favourites.includes(station) ? '⭐' : '☆'}
                </button>
              )}
            </div>
          </div>

          {station && (
            <button
              onClick={handleCheck}
              disabled={loading}
              style={{
                width: '100%', marginTop: 10, padding: '12px 16px', borderRadius: 10,
                border: 'none', background: loading ? 'var(--grey-bg)' : 'var(--primary)',
                color: 'white', fontSize: 14, fontWeight: 700, cursor: loading ? 'default' : 'pointer',
                transition: 'background 0.15s'
              }}
            >
              {loading ? L.loading : trainData ? L.refresh : L.checkArrivals}
            </button>
          )}
        </div>

        {error && (
          <div className="card" style={{ borderLeft: '4px solid var(--amber-text)' }}>
            <div style={{ color: 'var(--amber-text)', fontSize: 13, fontWeight: 600 }}>⚠️ {error}</div>
          </div>
        )}

        {trainData && (
          <div className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>📍 {stationDisplay(station)}</div>
              {lastUpdated && (
                <div style={{ fontSize: 10, color: 'var(--text-secondary)', textAlign: 'right' }}>
                  <div>{lastUpdated.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
                  <div style={{ color: 'var(--text-secondary)' }}>{isZh ? `${countdown} 秒後自動更新` : `Auto-refresh in ${countdown}s`}</div>
                </div>
              )}
            </div>

            {trainData.map((lineData, li) => {
              if (lineData.error) {
                return (
                  <div key={li} style={{ padding: '8px 10px', background: 'var(--amber-bg)', borderRadius: 8, marginBottom: 6, fontSize: 12 }}>
                    <span style={{ fontWeight: 700, color: LINE_COLORS[lineData.line] || 'var(--text)' }}>
                      {lineDisplay(lineData.line)}
                    </span>
                    <span style={{ marginLeft: 6, color: 'var(--amber-text)' }}>⚠️ {lineData.error}</span>
                  </div>
                );
              }
              if (!lineData.trains || lineData.trains.length === 0) return null;

              /* Group trains by direction so both UP and DOWN are shown */
              const dirGroups = {};
              lineData.trains.forEach(tr => {
                const d = tr.dir || 'UP';
                if (!dirGroups[d]) dirGroups[d] = [];
                dirGroups[d].push(tr);
              });
              const dirKeys = Object.keys(dirGroups);

              return (
                <div key={li} style={{ marginBottom: 10 }}>
                  <div style={{
                    fontSize: 12, fontWeight: 700, marginBottom: 4,
                    display: 'flex', alignItems: 'center', gap: 6,
                    color: LINE_COLORS[lineData.line] || 'var(--text)',
                    paddingBottom: 4, borderBottom: `2px solid ${LINE_COLORS[lineData.line] || '#eee'}`
                  }}>
                    <span style={{ width: 8, height: 8, borderRadius: '50%', background: LINE_COLORS[lineData.line] || '#999', display: 'inline-block' }} />
                    {lineDisplay(lineData.line)}
                  </div>
                  {dirKeys.map(dk => (
                  <div key={dk} style={{ display: 'grid', gap: 3, marginTop: 4 }}>
                    {dirGroups[dk].slice(0, 4).map((tr, ti) => {
                      const isNext = ti === 0;
                      return (
                      <div key={ti} style={{
                        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                        padding: '6px 10px', borderRadius: 6, fontSize: 13,
                        background: isNext ? 'var(--green-bg)' : 'var(--bg)',
                        borderLeft: isNext ? '3px solid var(--green)' : '3px solid transparent'
                      }}>
                        <span style={{ color: 'var(--text)' }}>
                          → {destDisplay(tr.destCode)}
                          <span style={{ color: 'var(--text-secondary)', marginLeft: 4, fontSize: 11 }}>{L.platform} {tr.plat}</span>
                        </span>
                        {(() => {
                          /* Compute arrival time: sys_time + ttnt minutes */
                          const mins = parseInt(tr.ttnt, 10);
                          const hm = (() => {
                            if (lineData.timestamp && !isNaN(mins)) {
                              const sys = new Date(lineData.timestamp.replace(' ', 'T'));
                              if (!isNaN(sys.getTime())) {
                                const arrival = new Date(sys.getTime() + mins * 60000);
                                return String(arrival.getHours()).padStart(2, '0') + ':' + String(arrival.getMinutes()).padStart(2, '0');
                              }
                            }
                            return '';
                          })();
                          if (tr.ttnt === '-') {
                            return (
                              <span style={{ fontWeight: 700, fontSize: 13, color: 'var(--green)' }}>
                                {L.now}
                              </span>
                            );
                          }
                          return (
                            <span style={{
                              fontWeight: 700, fontSize: 13, textAlign: 'right',
                              color: !isNaN(mins) && mins <= 2 ? 'var(--amber)' : 'var(--text)'
                            }}>
                              {tr.ttnt} {L.min}
                              {hm && <span style={{ fontWeight: 400, fontSize: 11, color: 'var(--text-secondary)', marginLeft: 4 }}>{hm}</span>}
                            </span>
                          );
                        })()}
                      </div>
                      );
                    })}
                  </div>
                  ))}
                </div>
              );
            })}

            {trainData.every(d => d.error || !d.trains || d.trains.length === 0) && !trainData.some(d => d.error) && (
              <div style={{ textAlign: 'center', padding: 16, color: 'var(--text-secondary)', fontSize: 13 }}>
                {L.noTrains}
              </div>
            )}
          </div>
        )}

        {!station && !trainData && (
          <div style={{ textAlign: 'center', padding: '30px 16px', color: 'var(--text-secondary)', fontSize: 13 }}>
            {L.selectPrompt}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Green Minibus ETA Page ───
const GMB_BASE = 'https://data.etagmb.gov.hk';

// Smart fetch: tries direct, then multiple CORS proxies
let gmbFetchMode = 'direct'; // 'direct' | 'proxy1' | 'proxy2' | 'proxy3' | 'failed'
const GMB_PROXIES = [
  url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
];

async function gmbFetch(path) {
  const url = `${GMB_BASE}${path}`;

  // Try direct fetch first (works from http/https origins)
  if (gmbFetchMode === 'direct') {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch (e) {
      console.warn('[GMB] Direct fetch failed:', e.message);
      gmbFetchMode = 'proxy1';
    }
  }

  // Try each proxy in order, cache which one works
  const proxyIdx = gmbFetchMode === 'proxy1' ? 0 : gmbFetchMode === 'proxy2' ? 1 : gmbFetchMode === 'proxy3' ? 2 : -1;
  for (let i = Math.max(0, proxyIdx); i < GMB_PROXIES.length; i++) {
    try {
      const proxyUrl = GMB_PROXIES[i](url);
      console.log('[GMB] Trying proxy ' + (i+1) + ':', proxyUrl.slice(0, 80));
      const r = await fetch(proxyUrl);
      if (!r.ok) throw new Error(`Proxy${i+1} HTTP ${r.status}`);
      const text = await r.text();
      // allorigins /get wraps in {contents: "..."}, others return raw JSON
      let data;
      try {
        const parsed = JSON.parse(text);
        if (parsed.contents && typeof parsed.contents === 'string') {
          data = JSON.parse(parsed.contents); // allorigins /get wrapper
        } else {
          data = parsed; // raw JSON proxy
        }
      } catch {
        throw new Error('Invalid JSON from proxy');
      }
      gmbFetchMode = `proxy${i+1}`;
      console.log('[GMB] Proxy ' + (i+1) + ' works! Caching.');
      return data;
    } catch (e) {
      console.warn('[GMB] Proxy ' + (i+1) + ' failed:', e.message);
    }
  }

  // All failed
  gmbFetchMode = 'failed';
  throw new Error(
    window.location.protocol === 'file:'
      ? 'CORS_FILE'
      : 'All fetch methods failed'
  );
}

  const [loadingRoute, setLoadingRoute] = useState(false);
  const [loadingStops, setLoadingStops] = useState(false);
  const [loadingEtas, setLoadingEtas] = useState(false);
