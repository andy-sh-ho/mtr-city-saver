      .then(data => {
        console.log('[GMB] route response:', JSON.stringify(data).slice(0, 500));
        const routeData = data.data;
        if (!routeData || (Array.isArray(routeData) && routeData.length === 0)) {
          setError('noRoute');
          return;
        }
        // routeData is array of route variants (usually 1)
        const route = Array.isArray(routeData) ? routeData[0] : routeData;
        setMatchedRoute(route);
        setDirections(route.directions || []);
        setDirIdx(0);
      })
      .catch(e => { console.error('[GMB] route error:', e); setError(e.message); })
      .finally(() => setLoadingRoute(false));
  }, [routeInput, region]);

  // Fetch stops when direction changes or route is matched
  useEffect(() => {
    setStops(null);
    setAllEtas({});
    if (!matchedRoute || !directions || directions.length === 0) return;
    const dir = directions[dirIdx];
    if (!dir) return;
    setLoadingStops(true);
    gmbFetch(`/route-stop/${matchedRoute.route_id}/${dir.route_seq}`)
      .then(data => {
        console.log('[GMB] route-stop response:', JSON.stringify(data).slice(0, 500));
        const raw = data.data;
        const stopList = Array.isArray(raw) ? raw : (raw?.route_stops || []);
        const mapped = stopList.map(s => ({
          stop_id: String(s.stop_id),
          stop_seq: s.stop_seq,
          name_tc: s.name_tc || '',
          name_en: s.name_en || '',
        }));
        mapped.sort((a, b) => a.stop_seq - b.stop_seq);
        setStops(mapped);
        setLoadingStops(false);
      })
      .catch(e => { console.error('[GMB] stops error:', e); setError(e.message); setLoadingStops(false); });
  }, [matchedRoute, directions, dirIdx]);

  // Fetch ETA for ALL stops — progressive loading (results appear as they arrive)
  const etaAbortRef = useRef(null);
  const fetchAllEtas = useCallback(() => {
    if (!matchedRoute || !stops || stops.length === 0 || !directions) return;
    // Abort any in-flight fetch cycle
    if (etaAbortRef.current) etaAbortRef.current.aborted = true;
    const cycle = { aborted: false };
    etaAbortRef.current = cycle;
    setLoadingEtas(true);
    setAllEtas({});
    const dir = directions[dirIdx];
    let done = 0;
    stops.forEach(stop => {
      gmbFetch(`/eta/route-stop/${matchedRoute.route_id}/${stop.stop_id}`)
        .then(data => {
          if (cycle.aborted) return;
          const allData = Array.isArray(data.data) ? data.data : [];
          const dirEtas = allData
            .filter(d => d.route_seq === dir.route_seq)
            .flatMap(d => d.enabled ? (d.eta || []) : []);
          // Progressive update — merge into state immediately
          setAllEtas(prev => ({ ...prev, [stop.stop_id]: dirEtas }));
        })
        .catch(e => {
          if (cycle.aborted) return;
          console.warn('[GMB] eta error for stop', stop.stop_id, e.message);
          setAllEtas(prev => ({ ...prev, [stop.stop_id]: [] }));
        })
        .finally(() => {
          if (cycle.aborted) return;
          done++;
          if (done >= stops.length) setLoadingEtas(false);
        });
    });
  }, [matchedRoute, stops, directions, dirIdx]);

  // Auto-fetch all ETAs when stops load
  useEffect(() => {
    if (stops && stops.length > 0) fetchAllEtas();
    return () => { if (etaAbortRef.current) etaAbortRef.current.aborted = true; };
  }, [stops]);

  const formatEta = (etaItem) => {
    if (!etaItem || !etaItem.timestamp) return null;
    // Use API's diff field if available, otherwise calculate from timestamp
    const mins = etaItem.diff != null ? etaItem.diff : Math.round((new Date(etaItem.timestamp).getTime() - Date.now()) / 60000);
    const dt = new Date(etaItem.timestamp);
    const hh = String(dt.getHours()).padStart(2, '0');
    const mm = String(dt.getMinutes()).padStart(2, '0');
    return { mins, time: `${hh}:${mm}`, remark_tc: etaItem.remarks_tc || '', remark_en: etaItem.remarks_en || '' };
  };

  return (
    <div>
      <div className="header" style={{ background: 'linear-gradient(135deg, #2d6a1e 0%, #4a9e35 100%)' }}>
        <div className="header-accent" style={{ background: '#8bc34a' }} />
        <div className="header-inner" style={{ position: 'relative' }}>
          <div className="header-logo" style={{ background: '#fff', color: '#2d6a1e' }}>GMB</div>
          <div>
            <h1>{L.gmbTitle}</h1>
            <div className="subtitle">{L.gmbSubtitle}</div>
          </div>
        </div>
      </div>

      <div className="section">
        <div className="card">
          {/* Region selector */}
          <div className="field-row">
            <div className="field-label">{L.gmbRegion}</div>
            <div style={{ display: 'flex', gap: 6 }}>
              {[['HKI', L.gmbRegionHKI], ['KLN', L.gmbRegionKLN], ['NT', L.gmbRegionNT]].map(([code, label]) => (
                <button key={code} onClick={() => { setRegion(code); setRouteInput(''); setMatchedRoute(null); setDirections(null); setStops(null); setAllEtas({}); setError(null); }}
                  style={{
                    flex: 1, padding: '8px 0', borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: 'pointer',
                    border: region === code ? '2px solid #2d6a1e' : '1px solid #ddd',
                    background: region === code ? '#e8f5e9' : '#fff',
                    color: region === code ? '#2d6a1e' : '#666'
                  }}>{label}</button>
              ))}
            </div>
          </div>

          {/* Route input with search button */}
          <div className="field-row" style={{ marginTop: 10 }}>
            <div className="field-label">{L.gmbRoute}</div>
            <div style={{ display: 'flex', gap: 6 }}>
              <input
                type="text"
                value={routeInput}
                onChange={e => setRouteInput(e.target.value.toUpperCase())}
                onKeyDown={e => { if (e.key === 'Enter') searchRoute(); }}
                placeholder={L.gmbRoutePlaceholder}
                style={{
                  flex: 1, padding: '10px 12px', borderRadius: 8, border: '1px solid #ddd',
                  fontSize: 14, boxSizing: 'border-box', outline: 'none'
                }}
              />
              <button
                onClick={searchRoute}
                disabled={loadingRoute || !routeInput.trim()}
                style={{
                  padding: '10px 16px', borderRadius: 8, border: 'none',
                  background: (!routeInput.trim() || loadingRoute) ? '#ccc' : '#2d6a1e', color: 'white',
                  fontSize: 13, fontWeight: 700, cursor: (!routeInput.trim() || loadingRoute) ? 'not-allowed' : 'pointer',
                  whiteSpace: 'nowrap'
                }}
              >
                {loadingRoute ? '...' : '🔍'}
              </button>
            </div>
          </div>

          {/* Direction selector */}
          {directions && directions.length > 1 && (
            <div className="field-row" style={{ marginTop: 10 }}>
              <div className="field-label">{L.gmbDirection}</div>
              <div style={{ display: 'flex', gap: 6 }}>
                {directions.map((dir, i) => (
                  <button key={i} onClick={() => setDirIdx(i)}
                    style={{
                      flex: 1, padding: '8px 6px', borderRadius: 8, fontSize: 11, fontWeight: 600, cursor: 'pointer',
                      border: dirIdx === i ? '2px solid #2d6a1e' : '1px solid #ddd',
                      background: dirIdx === i ? '#e8f5e9' : '#fff',
                      color: dirIdx === i ? '#2d6a1e' : '#666',
                      textAlign: 'center', lineHeight: 1.3
                    }}>
                    {isZh ? (dir.dest_tc || dir.description_tc || `方向 ${i+1}`) : (dir.dest_en || dir.description_en || `Direction ${i+1}`)}
                  </button>
                ))}
              </div>
            </div>
          )}

          {loadingStops && <div style={{ padding: '10px 0', fontSize: 12, color: '#999' }}>{L.gmbLoadingStops}</div>}
        </div>

        {/* Route info display */}
        {matchedRoute && directions && (
          <div style={{ padding: '4px 12px', fontSize: 11, color: '#666' }}>
            {isZh ? matchedRoute.description_tc : matchedRoute.description_en}
          </div>
        )}

        {error && (
          <div style={{ padding: '12px', textAlign: 'center', fontSize: 13 }}>
            {error === 'noRoute' ? (
              <span style={{ color: '#e65100' }}>{L.gmbNoRoute}</span>
            ) : error === 'CORS_FILE' ? (
              <div style={{ background: '#fff3e0', borderRadius: 10, padding: 14, textAlign: 'left' }}>
                <div style={{ fontWeight: 700, color: '#e65100', marginBottom: 6 }}>
                  {isZh ? '⚠️ 需要使用本地伺服器' : '⚠️ Local server required'}
                </div>
                <div style={{ color: '#666', fontSize: 12, lineHeight: 1.6 }}>
                  {isZh
                    ? '小巴API不支援從 file:// 直接存取。請用以下指令啟動本地伺服器：'
                    : 'The minibus API does not support access from file://. Start a local server:'}
                </div>
                <div style={{
                  background: '#1a1a2e', color: '#4fc3f7', padding: '8px 12px', borderRadius: 6,
                  fontFamily: 'monospace', fontSize: 11, marginTop: 6, wordBreak: 'break-all',
                  cursor: 'pointer', position: 'relative'
                }}
                  onClick={(ev) => {
                    const dir = window.location.pathname.replace(/\/[^/]*$/, '');
                    navigator.clipboard.writeText(`cd "${dir}" && python3 -m http.server 8080`);
                    const btn = ev.currentTarget;
                    const orig = btn.querySelector('.copy-hint');
                    if (orig) { orig.textContent = isZh ? '已複製 ✓' : 'Copied ✓'; setTimeout(() => { orig.textContent = isZh ? '點擊複製' : 'click to copy'; }, 2000); }
                  }}
                >
                  cd {window.location.pathname.replace(/\/[^/]*$/, '')} && python3 -m http.server 8080
                  <span className="copy-hint" style={{ position: 'absolute', right: 8, top: 8, fontSize: 10, color: '#aaa' }}>
                    {isZh ? '點擊複製' : 'click to copy'}
                  </span>
                </div>
                <div style={{ color: '#666', fontSize: 12, marginTop: 6, lineHeight: 1.6 }}>
                  {isZh
                    ? '然後於瀏覽器開啟 http://localhost:8080/'
                    : 'Then open http://localhost:8080/ in your browser'}
                </div>
              </div>
            ) : (
              <span style={{ color: '#e65100' }}>⚠️ {error}</span>
            )}
          </div>
        )}

        {/* All stops with ETA - shown once stops are loaded */}
        {stops && stops.length > 0 && (
          <div className="card" style={{ marginTop: 8, padding: 0 }}>
            {/* Header */}
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '10px 14px', borderBottom: '2px solid #4caf50'
            }}>
              <span style={{ fontSize: 13, fontWeight: 700, color: '#2d6a1e' }}>
                🚐 {isZh ? '路線' : 'Route'} {matchedRoute?.route_code}
              </span>
              <button
                onClick={fetchAllEtas}
                disabled={loadingEtas}
                style={{
                  padding: '4px 12px', borderRadius: 6, border: '1px solid #2d6a1e',
                  background: loadingEtas ? '#e8f5e9' : '#fff', color: '#2d6a1e',
                  fontSize: 11, fontWeight: 600, cursor: loadingEtas ? 'not-allowed' : 'pointer'
                }}
              >
                {loadingEtas ? (isZh ? '載入中...' : 'Loading...') : '🔄 ' + (isZh ? '更新' : 'Refresh')}
              </button>
            </div>

            {/* Loading progress */}
            {loadingEtas && stops && (
              <div style={{ padding: '6px 14px', fontSize: 11, color: '#999', display: 'flex', alignItems: 'center', gap: 6 }}>
                <span>{isZh ? '載入中' : 'Loading'} {Object.keys(allEtas).length}/{stops.length}</span>
                <div style={{ flex: 1, height: 3, background: '#eee', borderRadius: 2, overflow: 'hidden' }}>
                  <div style={{ width: `${(Object.keys(allEtas).length / stops.length) * 100}%`, height: '100%', background: '#4caf50', borderRadius: 2, transition: 'width 0.2s' }} />
                </div>
              </div>
            )}

            {/* Stop list with ETAs */}
            <div style={{ maxHeight: 'calc(100vh - 360px)', overflowY: 'auto' }}>
              {stops.map((stop, si) => {
                const etas = allEtas[stop.stop_id] || [];
                const hasEtas = etas.length > 0;
                const nextEta = hasEtas ? formatEta(etas[0]) : null;
                return (
                  <div key={stop.stop_id} style={{
                    padding: '8px 14px',
                    borderBottom: si < stops.length - 1 ? '1px solid #f0f0f0' : 'none',
                    background: hasEtas && nextEta && nextEta.mins <= 2 ? '#fff8e1' : '#fff'
                  }}>
                    {/* Stop name row */}
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: hasEtas ? 4 : 0 }}>
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                        width: 22, height: 22, borderRadius: '50%', fontSize: 10, fontWeight: 700,
                        background: hasEtas && nextEta && nextEta.mins <= 2 ? '#ff8f00' : '#e8f5e9',
                        color: hasEtas && nextEta && nextEta.mins <= 2 ? '#fff' : '#2d6a1e',
                        flexShrink: 0
                      }}>
                        {stop.stop_seq}
                      </span>
                      <span style={{ fontSize: 12, fontWeight: 500, color: '#333', flex: 1 }}>
                        {isZh ? stop.name_tc : stop.name_en}
                      </span>
                      {/* Quick ETA badge for first arrival */}
                      {nextEta && (
                        <span style={{
                          fontSize: 12, fontWeight: 700, flexShrink: 0,
                          color: nextEta.mins <= 0 ? 'var(--green)' : nextEta.mins <= 2 ? 'var(--amber)' : '#333'
                        }}>
                          {nextEta.mins <= 0
                            ? (isZh ? '即將到站' : 'Arriving')
                            : `${nextEta.mins} ${isZh ? '分鐘' : 'min'}`}
                        </span>
                      )}
                      {!hasEtas && Object.keys(allEtas).length > 0 && (
                        <span style={{ fontSize: 10, color: '#bbb', flexShrink: 0 }}>
                          {isZh ? '暫無班次' : 'No ETA'}
                        </span>
                      )}
                    </div>
                    {/* Detailed ETAs for this stop */}
                    {hasEtas && etas.length > 0 && (
                      <div style={{ display: 'flex', gap: 6, paddingLeft: 30, flexWrap: 'wrap' }}>
                        {etas.slice(0, 3).map((e, ei) => {
                          const fmt = formatEta(e);
                          if (!fmt) return null;
                          return (
                            <span key={ei} style={{
                              fontSize: 10, color: '#888', background: ei === 0 ? '#e8f5e9' : '#f5f5f5',
                              padding: '2px 6px', borderRadius: 4
                            }}>
                              {ei === 0 ? '➊' : ei === 1 ? '➋' : '➌'}{' '}
                              {fmt.mins <= 0 ? (isZh ? '到站' : 'Arr') : `${fmt.mins}${isZh ? '分' : 'm'}`}{' '}
                              {fmt.time}
                              {fmt.remark_tc && isZh ? ` (${fmt.remark_tc})` : ''}
                              {fmt.remark_en && !isZh ? ` (${fmt.remark_en})` : ''}
                            </span>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {!routeInput && !matchedRoute && (
          <div style={{ textAlign: 'center', padding: '30px 16px', color: '#999', fontSize: 13 }}>
            {L.gmbSelectRoute}
          </div>
        )}
      </div>
    </div>
  );
}

                        {isZh ? '起點及終點均不在覆蓋範圍，無法使用拆程方案。' : 'Both stations outside coverage. No split-journey benefit.'}
                        {directFare && <div style={{ marginTop: 4, fontWeight: 600 }}>{isZh ? `八達通直達：HK$${directFare}` : `Octopus direct: HK$${directFare}`}</div>}

                      )}
                    </div>
                    {directFare && (
                      <div style={{ marginTop: 8, padding: '6px 10px', borderRadius: 6, fontSize: 12, fontWeight: 600, textAlign: 'center', background: split.totalPerTrip < directFare ? 'var(--green-bg)' : 'var(--red-bg)', color: split.totalPerTrip < directFare ? 'var(--green-text)' : 'var(--red-text)' }}>
                        {split.totalPerTrip < directFare
                          ? (isZh ? `拆程每程可節省 HK$${(directFare - split.totalPerTrip).toFixed(1)}` : `Split saves HK$${(directFare - split.totalPerTrip).toFixed(1)} per trip`)
                          : (isZh ? `拆程反而貴 HK$${(split.totalPerTrip - directFare).toFixed(1)}` : `Split costs HK$${(split.totalPerTrip - directFare).toFixed(1)} more`)}
                      </div>
                    )}
                    <div style={{ marginTop: 8, fontSize: 11, color: 'var(--text-secondary)', lineHeight: 1.5 }}>
                      💡 {isZh ? '拆程需於中途站出閘再入閘。都會票段每程計算一次乘車次數。' : 'Split requires tapping out and in at the interchange. The City Saver leg counts as one ride.'}
                    </div>
                  </div>
                ) : (
                  <div style={{ marginTop: 8, padding: '8px 12px', background: 'var(--card)', borderRadius: 8, fontSize: 12, color: 'var(--text-secondary)', border: '1px solid var(--border)' }}>
                    {isZh ? '未找到可用的拆程方案。建議使用八達通直達。' : 'No split-journey option found. Consider using Octopus directly.'}
                    {directFare && <div style={{ marginTop: 4, fontWeight: 600 }}>{isZh ? `八達通直達：HK$${directFare}` : `Octopus direct: HK$${directFare}`}</div>}
                  </div>
                )}
              </div>
            );
          })()}

          {/* TST <-> East TST tip */}
          {originStation && destStation && (
            originStation === 'Tsim Sha Tsui' || originStation === 'East Tsim Sha Tsui' ||
            destStation === 'Tsim Sha Tsui' || destStation === 'East Tsim Sha Tsui'
          ) && (
            <div style={{ marginTop: 8, padding: '8px 12px', background: 'var(--info-bg)', borderRadius: 8, fontSize: 12, color: 'var(--info-text)', display: 'flex', gap: 6, alignItems: 'flex-start' }}>
              <span>💡</span>
              <div>{isZh ? <span><strong>尖沙咀</strong>↔<strong>尖東</strong> 30分鐘內轉乘，不額外扣除都會票次數。</span> : <span><strong>TST</strong> ↔ <strong>East TST</strong> interchange within 30 min does not deduct an extra City Saver ride.</span>}</div>
            </div>
          )}

          {/* Both eligible — octopus fare input */}
          {originStation && destStation && ALL_STATIONS_MAP[originStation]?.cs && ALL_STATIONS_MAP[destStation]?.cs && (
            <div style={{ marginTop: 12 }}>
              <div className="field-label">
                {isZh ? '成人八達通單程車費' : 'Adult Octopus Single Trip Fare'}
                {stopsCount > 0 && <span style={{ fontWeight: 400, marginLeft: 6 }}>({stopsCount} {isZh ? '站' : stopsCount > 1 ? 'stops' : 'stop'})</span>}
              </div>
              <div className="fare-input-row">
                <span className="fare-input-prefix">HK$</span>
                <input type="number" className="fare-input" placeholder="e.g. 12.5" value={octopusFare} onChange={e => setOctopusFare(e.target.value)} step="0.1" min="0" />
                <span className="fare-input-label">{isZh ? '每程' : 'per trip'}</span>
              </div>
              <div style={{ fontSize: 11, color: 'var(--text-secondary)', marginTop: 6 }}>
                {lookupFare(originStation, destStation)
                  ? <span style={{ color: 'var(--green)' }}>✓ {isZh ? '已自動填入港鐵車費資料' : 'Auto-filled from MTR fare data'}</span>
                  : <span>{isZh ? '未找到車費，請手動輸入' : 'Fare not found — enter manually'}</span>}
              </div>
              <div style={{ fontSize: 10, color: 'var(--text-secondary)', marginTop: 2 }}>
                {lang === 'zh' ? '車費數據更新：2026年4月' : 'Fare data updated: Apr 2026'}
              </div>

              {/* Planned rides input */}
              <div style={{ marginTop: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ fontSize: 12, color: 'var(--text-secondary)', whiteSpace: 'nowrap' }}>{L.ridesPlanned}:</span>
                <input type="number" min="1" max="40" value={ridesPlanned} onChange={e => setRidesPlanned(Math.min(40, Math.max(1, parseInt(e.target.value) || 1)))}
                  style={{ width: 64, padding: '6px 10px', border: '2px solid var(--border)', borderRadius: 8, fontSize: 14, fontWeight: 600, fontFamily: 'inherit', textAlign: 'center' }} />
                <span style={{ fontSize: 11, color: 'var(--text-secondary)' }}>{isZh ? '/ 40 程' : '/ 40 rides'}</span>
              </div>
            </div>
          )}
        </div>

        {/* Comparison results */}
        {originStation && destStation && ALL_STATIONS_MAP[originStation]?.cs && ALL_STATIONS_MAP[destStation]?.cs && octopusFare && parseFloat(octopusFare) > 0 && (() => {
          const fare = parseFloat(octopusFare);
          const ridesUsed = ridesPlanned;
          const octopusTotal = ridesUsed * fare;
          const citySaverTotal = 460;
          const savings = octopusTotal - citySaverTotal;
          const citySaverPerRide = ridesUsed > 0 ? (citySaverTotal / ridesUsed).toFixed(1) : '—';
          const breakEvenRides = Math.ceil(citySaverTotal / fare);
          const isSaving = savings > 0;

          const SUBSIDY_THRESHOLD = 500, SUBSIDY_RATE = 1 / 3, SUBSIDY_CAP = 400;
          const calcSubsidy = (spend) => spend <= SUBSIDY_THRESHOLD ? 0 : Math.min((spend - SUBSIDY_THRESHOLD) * SUBSIDY_RATE, SUBSIDY_CAP);
          const octSubsidy = calcSubsidy(octopusTotal);
          const octAfterSubsidy = octopusTotal - octSubsidy;
          const csSubsidy = calcSubsidy(citySaverTotal);
          const csAfterSubsidy = citySaverTotal - csSubsidy;
          const savingsAfterSubsidy = octAfterSubsidy - csAfterSubsidy;
          const isSavingAfterSubsidy = savingsAfterSubsidy > 0;

          return (
            <div className="card">
              <div className="section-title" style={{ marginBottom: 8 }}>
                {isZh ? `比較結果（${STATION_ZH[originStation] || originStation} ↔ ${STATION_ZH[destStation] || destStation}）` : `Results (${originStation} ↔ ${destStation})`}
              </div>
              <div className="fare-compare-grid">
                <div className="fare-compare-card octopus">
                  <div className="fc-label">{isZh ? '八達通' : 'Octopus'}</div>
                  <div className="fc-amount">${octopusTotal.toFixed(1)}</div>
                  <div className="fc-sub">{ridesUsed} {isZh ? '程' : 'rides'} x ${fare}</div>
                </div>
                <div className="fare-compare-card citysaver">
                  <div className="fc-label">{isZh ? '都會票' : 'City Saver'}</div>
                  <div className="fc-amount">$460</div>
                  <div className="fc-sub">${citySaverPerRide} {isZh ? '每程' : 'per ride'}</div>
                </div>
              </div>
              <div className={`savings-banner ${savings === 0 ? 'even' : isSaving ? 'save' : 'lose'}`}>
                {savings === 0
                  ? <>{isZh ? '剛好打和' : 'Exact break-even'}<span className="savings-amount">{isZh ? '費用相同' : 'Same cost'}</span></>
                  : isSaving
                    ? <>{isZh ? '都會票為你節省' : 'City Saver saves you'}<span className="savings-amount">HK${savings.toFixed(1)}</span></>
                    : <>{isZh ? '八達通更便宜' : 'Octopus is cheaper by'}<span className="savings-amount">HK${Math.abs(savings).toFixed(1)}</span></>}
                <div className="savings-sub">
                  {isSaving ? (isZh ? `比八達通節省 ${((savings / octopusTotal) * 100).toFixed(0)}%` : `${((savings / octopusTotal) * 100).toFixed(0)}% saved vs Octopus`)
                    : savings === 0 ? (isZh ? `兩種方案均為 HK$${octopusTotal.toFixed(0)}` : `Both cost HK$${octopusTotal.toFixed(0)}`)
                    : (isZh ? `${ridesUsed} 程不值得使用都會票` : `City Saver not worth it for ${ridesUsed} rides`)}
                </div>
              </div>

              {(octSubsidy > 0 || csSubsidy > 0) && (
                <div className="subsidy-section">
                  <div className="subsidy-header">
                    <span>🏛️</span>
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 13 }}>{isZh ? '扣除交通補貼後' : 'After Transport Subsidy'}</div>
                      <div style={{ fontSize: 11, color: 'var(--text-secondary)' }}>{isZh ? '門檻 $500 · 補貼 1/3 · 上限 $400' : 'Threshold $500 · 1/3 rate · Cap $400'}</div>
                    </div>
                  </div>
                  <div className="fare-compare-grid" style={{ marginTop: 8 }}>
                    <div className="fare-compare-card octopus">
                      <div className="fc-label">{isZh ? '八達通' : 'Octopus'}</div>
                      <div className="fc-amount">${octAfterSubsidy.toFixed(1)}</div>
                      <div className="fc-sub">{isZh ? '補貼' : 'Subsidy'}: -${octSubsidy.toFixed(1)}</div>
                    </div>
                    <div className="fare-compare-card citysaver">
                      <div className="fc-label">{isZh ? '都會票' : 'City Saver'}</div>
                      <div className="fc-amount">${csAfterSubsidy.toFixed(1)}</div>
                      <div className="fc-sub">{isZh ? '補貼' : 'Subsidy'}: -${csSubsidy.toFixed(1)}</div>
                    </div>
                  </div>
                  <div className={`savings-banner ${savingsAfterSubsidy === 0 ? 'even' : isSavingAfterSubsidy ? 'save' : 'lose'}`} style={{ marginTop: 8 }}>
                    {savingsAfterSubsidy === 0
                      ? <>{isZh ? '補貼後費用相同' : 'After subsidy: same cost'}<span className="savings-amount">{isZh ? '打和' : 'Break even'}</span></>
                      : isSavingAfterSubsidy
                        ? <>{isZh ? '補貼後，都會票節省' : 'After subsidy, City Saver saves'}<span className="savings-amount">HK${savingsAfterSubsidy.toFixed(1)}</span></>
                        : <>{isZh ? '補貼後，八達通更便宜' : 'After subsidy, Octopus cheaper by'}<span className="savings-amount">HK${Math.abs(savingsAfterSubsidy).toFixed(1)}</span></>}
                  </div>
                  {csSubsidy === 0 && octSubsidy > 0 && (
                    <div style={{ fontSize: 11, color: 'var(--amber-text)', marginTop: 6, lineHeight: 1.5, background: 'var(--amber-bg)', padding: '6px 8px', borderRadius: 6 }}>
                      {isZh ? `⚠️ 都會票（$460）低於 $500 門檻，無補貼。八達通（$${octopusTotal.toFixed(0)}）可獲 $${octSubsidy.toFixed(1)} 補貼。` : `⚠️ City Saver ($460) is below the $500 threshold — no subsidy. Octopus ($${octopusTotal.toFixed(0)}) qualifies for $${octSubsidy.toFixed(1)} back.`}
                    </div>
                  )}
                  <div style={{ fontSize: 11, color: 'var(--text-secondary)', marginTop: 6, lineHeight: 1.5 }}>
                    * {isZh ? '估算假設所有車程在同一曆月內完成。' : 'Estimate assumes all rides fall within one calendar month.'}
                  </div>
                </div>
              )}

              <div className="card" style={{ marginTop: 10, padding: '10px 14px', boxShadow: 'none', border: '1px solid var(--border)' }}>
                <div className="breakeven-row">
                  <span className="breakeven-label">{isZh ? '打和乘車次數' : 'Break-even rides'}</span>
                  <span className="breakeven-value">{breakEvenRides} {isZh ? '程' : 'rides'}</span>
                </div>
                <div className="breakeven-row">
                  <span className="breakeven-label">{isZh ? '你的計劃次數' : 'Your planned rides'}</span>
                  <span className="breakeven-value" style={{ color: ridesUsed >= breakEvenRides ? 'var(--green)' : 'var(--red)' }}>{ridesUsed} {isZh ? '程' : 'rides'}</span>
                </div>
                <div className="breakeven-row">
                  <span className="breakeven-label">{isZh ? '八達通每程' : 'Octopus per ride'}</span>
                  <span className="breakeven-value">${fare.toFixed(1)}</span>
                </div>
                <div className="breakeven-row">
                  <span className="breakeven-label">{isZh ? '都會票每程' : 'City Saver per ride'}</span>
                  <span className="breakeven-value">${citySaverPerRide}</span>
                </div>
              </div>
            </div>
          );
        })()}

        {/* Station Coverage toggle */}
        <div style={{ padding: '0 16px 16px' }}>
          <button
            onClick={() => setShowCoverage(prev => !prev)}
            style={{
              width: '100%', padding: '12px 16px', borderRadius: 10,
              border: '1px solid var(--border)', background: 'var(--card)',
              color: 'var(--text)', fontSize: 13, fontWeight: 600, cursor: 'pointer',
              display: 'flex', justifyContent: 'space-between', alignItems: 'center'
            }}
          >
            <span>🚇 {isZh ? '都會票覆蓋車站' : 'City Saver Station Coverage'}</span>
            <span style={{ fontSize: 12, color: 'var(--text-secondary)' }}>{showCoverage ? '▾' : '›'}</span>
          </button>
          {showCoverage && <StationCoverage />}
        </div>
      </div>
    </div>
  );
}

// ─── History Helpers ───
function parseHistoryDate(ds) {
  if (!ds) return null;
  const [y, m, d] = ds.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function makeGetRidesForDate(workMode, customDays, holidays, overrides, startDate, endDate) {
  return (date) => computeRidesForDate(date, workMode, customDays, holidays, overrides, startDate, endDate);
}

// ─── History Page ───
function HistoryPage({ history, onDelete, onEdit }) {
  const lang = useLang();
  const L = I18N[lang] || I18N.en;
  const isZh = lang === 'zh';
  const [expandedId, setExpandedId] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [editRides, setEditRides] = useState(0);
  const [deletePendingId, setDeletePendingId] = useState(null);
  const [showCalId, setShowCalId] = useState(null);
  const [histCalYear, setHistCalYear] = useState(null);
  const [histCalMonth, setHistCalMonth] = useState(null);
  const fileInputRef = React.useRef(null);
  const [importToast, setImportToast] = useState(null);
  const [importConfirmData, setImportConfirmData] = useState(null);

  const handleExport = React.useCallback(() => {
    try {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('mtr-cs-')) {
          data[key] = localStorage.getItem(key);
        }
      }
      const json = JSON.stringify(data, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const today = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `mtr-city-saver-backup-${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error('Export failed:', err);
    }
  }, []);

  const handleImport = React.useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        const keys = Object.keys(data);
        if (!keys.length || !keys.some(k => k.startsWith('mtr-cs-'))) {
          setImportToast({ type: 'error', msg: L.importError });
          setTimeout(() => setImportToast(null), 3000);
          return;
        }
        setImportConfirmData(data);
      } catch {
        setImportToast({ type: 'error', msg: L.importError });
        setTimeout(() => setImportToast(null), 3000);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }, [L]);

  React.useEffect(() => {
    if (expandedId !== null) {
      const rec = history.find(r => r.id === expandedId);
      if (rec && rec.startDate) {
        const [y, m] = rec.startDate.split('-').map(Number);
        setHistCalYear(y);
        setHistCalMonth(m - 1);
      }
    } else {
      setHistCalYear(null);
      setHistCalMonth(null);
    }
  }, [expandedId]);

  const sorted = useMemo(() => [...history].reverse(), [history]);
  const fmtDate = useCallback((ds) => {
    if (!ds) return '—';
    const [y, m, d] = ds.split('-');
    const date = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    return date.toLocaleDateString(isZh ? 'zh-HK' : 'en-GB', { day: 'numeric', month: isZh ? 'long' : 'short', year: 'numeric' });
  }, [isZh]);
  const workModeLabel = useCallback((mode) => {
    if (mode === 'office') return isZh ? '星期一至五' : 'Mon–Fri';
    if (mode === 'service') return isZh ? '星期一至六' : 'Mon–Sat';
    return isZh ? '自訂' : 'Custom';
  }, [isZh]);

  const { showStats, avgRides, completedCount } = useMemo(() => {
    const show = history.length >= 2;
    return {
      showStats: show,
      avgRides: show ? (history.reduce((s, r) => s + r.ridesUsed, 0) / history.length).toFixed(1) : null,
      completedCount: history.filter(r => r.completed).length,
    };
  }, [history]);
  const totalSavings = history.reduce((sum, r) => sum + (r.totalSavings != null ? r.totalSavings : 0), 0);

  return (
    <div>
      {importToast && (
        <div style={{ position: 'fixed', top: 20, left: '50%', transform: 'translateX(-50%)', zIndex: 10000, padding: '12px 24px', borderRadius: 10, background: importToast.type === 'error' ? 'var(--red, #dc0714)' : 'var(--green, #00a651)', color: '#fff', fontSize: 14, fontWeight: 600, boxShadow: '0 4px 16px rgba(0,0,0,0.2)' }}>
          {importToast.msg}
        </div>
      )}
      {importConfirmData && (
        <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.5)', zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div style={{ background: 'var(--card, #fff)', borderRadius: 14, padding: 24, width: '100%', maxWidth: 320, boxShadow: '0 8px 32px rgba(0,0,0,0.2)', textAlign: 'center' }}>
            <div style={{ fontSize: 32, marginBottom: 12 }}>📥</div>
            <p style={{ fontSize: 15, color: 'var(--text, #333)', marginBottom: 20 }}>{L.importConfirm}</p>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={() => setImportConfirmData(null)} style={{ flex: 1, padding: '10px 0', borderRadius: 8, border: 'none', background: 'var(--grey-bg, #e8e8e8)', color: 'var(--text, #333)', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
                {isZh ? '取消' : 'Cancel'}
              </button>
              <button onClick={() => {
                Object.keys(importConfirmData).forEach(k => { if (k.startsWith('mtr-cs-')) localStorage.setItem(k, importConfirmData[k]); });
                setImportConfirmData(null);
                setImportToast({ type: 'success', msg: L.importSuccess });
                setTimeout(() => window.location.reload(), 1000);
              }} style={{ flex: 1, padding: '10px 0', borderRadius: 8, border: 'none', background: 'var(--primary, #dc0714)', color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
                {isZh ? '確認匯入' : 'Confirm'}
              </button>
            </div>
          </div>
        </div>
      )}
      <div className="header">
        <div className="header-accent" />
        <div className="header-inner">
          <div className="header-logo">🚇</div>
          <div>
            <h1>{L.historyTitle}</h1>
            <div className="subtitle">{isZh ? '每張車票使用記錄' : 'Record of past tickets'}</div>
          </div>
        </div>
      </div>

      <div className="section">
        {showStats && (
          <div className="history-stats-row">
            <div className="history-stat-card">
              <div className="history-stat-val">{avgRides}</div>
              <div className="history-stat-label">{L.statsAvgRides}</div>
            </div>
            <div className="history-stat-card">
              <div className="history-stat-val">{completedCount}</div>
              <div className="history-stat-label">{L.statsCompleted}</div>
            </div>
          </div>
        )}

        {history.length === 0 && (
          <div className="card" style={{ textAlign: 'center', padding: '32px 16px', color: 'var(--text-secondary)', fontSize: 13, lineHeight: 1.7 }}>
            📋
            <div style={{ marginTop: 8, whiteSpace: 'pre-line' }}>{L.historyEmpty}</div>
          </div>
        )}

        {sorted.map((rec) => {
          const isExpanded = expandedId === rec.id;
          const hasCalData = rec.overrides !== undefined;
          let calProps = null;
          if (isExpanded && hasCalData) {
            const recStart = parseHistoryDate(rec.startDate);
            const recEnd = rec.startDate ? addDays(recStart, 39) : null;
            const recOverrides = rec.overrides || {};
            const recNotes = rec.notes || {};
            const recHolidays = rec.holidays || {};
            const recCustomDays = rec.customDays || { 1: true, 2: true, 3: true, 4: true, 5: true, 6: false, 0: false };
            const recQuotaMap = rec.quotaMap || {};
            const recWeekStart = rec.weekStart || 'sun';
            const getRides = makeGetRidesForDate(rec.workMode, recCustomDays, recHolidays, recOverrides, recStart, recEnd);
            const viewY = histCalYear !== null ? histCalYear : (recStart ? recStart.getFullYear() : new Date().getFullYear());
            const viewM = histCalMonth !== null ? histCalMonth : (recStart ? recStart.getMonth() : 0);
            calProps = { recStart, recEnd, recOverrides, recNotes, recHolidays, recQuotaMap, recWeekStart, getRides, viewY, viewM };
          }

          return (
            <div key={rec.id} className="history-record" onClick={() => setExpandedId(isExpanded ? null : rec.id)}>
              <div className="history-record-header">
                <div>
                  <div className="history-record-dates">
                    {fmtDate(rec.startDate)} → {rec.startDate ? fmtDate(dateToStr(addDays(parseHistoryDate(rec.startDate), 39))) : '—'}
                  </div>
                  <div className="history-record-sub">
                    {rec.ridesUsed}/40 {isZh ? '程' : 'rides'}
                    {rec.ridesWasted > 0 && <span style={{ color: 'var(--amber)', marginLeft: 6 }}>({rec.ridesWasted} {L.histRidesWasted})</span>}
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span className={`history-badge ${rec.completed ? 'completed' : 'expired'}`}>
                    {rec.completed ? L.histCompleted : L.histExpired}
                  </span>
                  <span style={{ color: 'var(--text-secondary)', fontSize: 14 }}>{isExpanded ? '▾' : '›'}</span>
                </div>
              </div>

              {isExpanded && (
                <div>
                  <div className="history-record-detail">
                    <span>{L.histWorkMode}: {workModeLabel(rec.workMode)}</span>
                    <span>{isZh ? '儲存日' : 'Archived'}: {fmtDate(rec.endDate)}</span>
                    <div style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
                      {editingId === rec.id ? (
                        <>
                          <button
                            style={{ background: 'var(--green-bg)', color: 'var(--green)', border: '1px solid var(--green)', borderRadius: 6, padding: '4px 8px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}
                            onClick={(e) => {
                              e.stopPropagation();
                              const val = Math.max(0, Math.min(40, editRides));
                              const updatedSavings = rec.octopusFare ? val * rec.octopusFare - 460 : rec.totalSavings;
                              onEdit && onEdit(rec.id, { ridesUsed: val, completed: val >= 40, totalSavings: updatedSavings });
                              setEditingId(null);
                            }}
                          >{L.histSave}</button>
                          <button
                            style={{ background: 'transparent', color: 'var(--text-secondary)', border: '1px solid var(--border)', borderRadius: 6, padding: '4px 8px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}
                            onClick={(e) => { e.stopPropagation(); setEditingId(null); }}
                          >{L.histCancel}</button>
                        </>
                      ) : (
                        <button
                          style={{ background: 'transparent', color: 'var(--text-secondary)', border: '1px solid var(--border)', borderRadius: 6, padding: '4px 8px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}
                          onClick={(e) => { e.stopPropagation(); setEditingId(rec.id); setEditRides(rec.ridesUsed); }}
                        >{L.histEdit}</button>
                      )}
                      <button
                        style={{ background: deletePendingId === rec.id ? 'var(--red-bg)' : 'transparent', color: deletePendingId === rec.id ? 'var(--red)' : 'var(--text-secondary)', border: `1px solid ${deletePendingId === rec.id ? 'var(--red)' : 'var(--border)'}`, borderRadius: 6, padding: '4px 8px', fontSize: 11, fontWeight: 700, cursor: 'pointer' }}
                        onClick={(e) => {
                          e.stopPropagation();
                          if (deletePendingId === rec.id) { onDelete && onDelete(rec.id); setDeletePendingId(null); setExpandedId(null); }
                          else { setDeletePendingId(rec.id); setTimeout(() => setDeletePendingId(prev => prev === rec.id ? null : prev), 2500); }
                        }}
                      >🗑 {deletePendingId === rec.id ? L.histDeleteConfirm : L.histDelete}</button>
                    </div>
                  </div>

                  {editingId === rec.id && (
                    <div style={{ padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 }} onClick={e => e.stopPropagation()}>
                      <span style={{ color: 'var(--text-secondary)', fontWeight: 600 }}>{L.histRidesLabel}:</span>
                      <input
                        type="number" min="0" max="40" value={editRides}
                        onChange={(e) => setEditRides(Math.max(0, Math.min(40, parseInt(e.target.value) || 0)))}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') { const val = Math.max(0, Math.min(40, editRides)); const updSavings = rec.octopusFare ? val * rec.octopusFare - 460 : rec.totalSavings; onEdit && onEdit(rec.id, { ridesUsed: val, completed: val >= 40, totalSavings: updSavings }); setEditingId(null); }
                          if (e.key === 'Escape') setEditingId(null);
                        }}
                        autoFocus
                        style={{ width: 60, padding: '4px 8px', border: '1px solid var(--border)', borderRadius: 6, fontSize: 13, textAlign: 'center', background: 'var(--card)', color: 'var(--text)' }}
                      />
                      <span style={{ color: 'var(--text-secondary)' }}>/40</span>
                    </div>
                  )}

                  {(() => {
                    const totalRides = rec.ridesUsed || 0;
                    let daysRidden = 0;
                    if (rec.startDate) {
                      const rStart = parseHistoryDate(rec.startDate);
                      const rEnd = addDays(rStart, 39);
                      const rGetRides = makeGetRidesForDate(rec.workMode, rec.customDays || { 1:true,2:true,3:true,4:true,5:true,6:false,0:false }, rec.holidays || {}, rec.overrides || {}, rStart, rEnd);
                      let quotaLeft = 40;
                      for (let d = new Date(rStart); d <= rEnd && quotaLeft > 0; d.setDate(d.getDate() + 1)) {
                        const { rides } = rGetRides(new Date(d));
                        if (rides > 0) { daysRidden++; quotaLeft -= rides; }
                      }
                    }
                    const dailyAvg = daysRidden > 0 ? (totalRides / daysRidden).toFixed(1) : '—';
                    const usageRate = ((totalRides / 40) * 100).toFixed(0);
                    return (
                      <div className="hist-summary-row">
                        <div className="hist-summary-item"><span className="hs-label">{L.histDaysRidden}</span><span className="hs-val">{daysRidden}</span></div>
                        <div className="hist-summary-item"><span className="hs-label">{L.histTotalRides}</span><span className="hs-val">{totalRides}</span></div>
                        <div className="hist-summary-item"><span className="hs-label">{L.histDailyAvg}</span><span className="hs-val">{dailyAvg}</span></div>
                        <div className="hist-summary-item"><span className="hs-label">{L.histUsageRate}</span><span className="hs-val">{usageRate}%</span></div>
                      </div>
                    );
                  })()}

                  {calProps && (
                    <div onClick={e => e.stopPropagation()}>
                      <button
                        onClick={() => setShowCalId(prev => prev === rec.id ? null : rec.id)}
                        style={{ display: 'block', width: '100%', padding: '8px', border: 'none', background: 'transparent', color: 'var(--text-secondary)', fontSize: 11, fontWeight: 600, cursor: 'pointer', textAlign: 'center' }}
                      >{showCalId === rec.id ? (isZh ? '▾ 收起日曆' : '▾ Hide Calendar') : (isZh ? '▸ 查看日曆' : '▸ View Calendar')}</button>
                      {showCalId === rec.id && (
                        <div style={{ padding: '0 10px 12px' }}>
                          <CalendarMonth
                            year={calProps.viewY} month={calProps.viewM}
                            startDate={calProps.recStart} endDate={calProps.recEnd}
                            weekStart={calProps.recWeekStart} holidays={calProps.recHolidays}
                            getRidesForDate={calProps.getRides} overrides={calProps.recOverrides}
                            onCellTap={null} onCellLongPress={null} showNav={true}
                            onPrev={() => setHistCalMonth(prev => { if (prev === 0) { setHistCalYear(y => y - 1); return 11; } return (prev || calProps.viewM) - 1; })}
                            onNext={() => setHistCalMonth(prev => { if (prev === 11) { setHistCalYear(y => y + 1); return 0; } return (prev || calProps.viewM) + 1; })}
                            quotaMap={calProps.recQuotaMap} notes={calProps.recNotes}
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}

        <div style={{ display: 'flex', justifyContent: 'center', gap: 12, marginTop: 20, marginBottom: 8 }}>
          <button
            onClick={handleExport}
            style={{ background: 'transparent', border: '1px solid var(--border)', borderRadius: 6, padding: '6px 14px', fontSize: 12, color: 'var(--text-secondary)', cursor: 'pointer', fontWeight: 500 }}
          >💾 {L.exportData}</button>
          <button
            onClick={() => fileInputRef.current?.click()}
            style={{ background: 'transparent', border: '1px solid var(--border)', borderRadius: 6, padding: '6px 14px', fontSize: 12, color: 'var(--text-secondary)', cursor: 'pointer', fontWeight: 500 }}
          >📂 {L.importData}</button>
          <input
            ref={fileInputRef}
            type="file"
            accept=".json"
            style={{ display: 'none' }}
            onChange={handleImport}
          />
        </div>
      </div>
    </div>
  );
}

// ─── Root App with Tab Navigation ───
function OnboardingOverlay({ lang, onDismiss }) {
  const L = I18N[lang] || I18N.en;
  const todayStr = (() => {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  })();
  const [startDate, setStartDate] = useState(todayStr);

  const handleStart = () => {
    try { localStorage.setItem('mtr-cs-startDateStr', startDate); } catch {}
    onDismiss();
  };

  return (
    <div className="onboarding-overlay">
      <div className="onboarding-logo">🚇</div>
      <div className="onboarding-title">{L.onboardingTitle}</div>
      <div className="onboarding-subtitle">{L.onboardingSubtitle}</div>

      <div className="onboarding-steps">
        <div className="onboarding-step">
          <div className="onboarding-step-num">1</div>
          <div>
            <div className="onboarding-step-text">{L.onboardingStep1}</div>
            <div className="onboarding-step-sub">{L.onboardingStep1Sub}</div>
          </div>
        </div>
        <div className="onboarding-step">
          <div className="onboarding-step-num">2</div>
          <div>
            <div className="onboarding-step-text">{L.onboardingStep2}</div>
            <div className="onboarding-step-sub">{L.onboardingStep2Sub}</div>
          </div>
        </div>
        <div className="onboarding-step">
          <div className="onboarding-step-num">3</div>
          <div>
            <div className="onboarding-step-text">{L.onboardingStep3}</div>
            <div className="onboarding-step-sub">{L.onboardingStep3Sub}</div>
          </div>
        </div>
      </div>

      <div className="onboarding-date-section">
        <div className="onboarding-date-label">{L.onboardingDateLabel}</div>
        <input
          type="date"
          className="onboarding-date-input"
          value={startDate}
          max={todayStr}
          onChange={e => setStartDate(e.target.value)}
        />
      </div>

      <button className="onboarding-start" onClick={handleStart}>
        {L.onboardingStart}
      </button>
      <div className="onboarding-footer">{L.onboardingTip}</div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false, error: null }; }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: 32, textAlign: 'center', fontFamily: '-apple-system, sans-serif' }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>⚠️</div>
          <h2 style={{ fontSize: 18, marginBottom: 8, color: 'var(--text, #333)' }}>Something went wrong</h2>
          <p style={{ fontSize: 13, color: 'var(--text-secondary, #999)', marginBottom: 16 }}>
            {this.state.error?.message || 'An unexpected error occurred'}
          </p>
          <button onClick={() => { location.reload(); }}
            style={{ padding: '10px 20px', border: '2px solid #0078d4', borderRadius: 8, background: 'white', color: '#0078d4', fontSize: 14, fontWeight: 600, cursor: 'pointer', marginRight: 8 }}>
            Reload / 重新載入
          </button>
          {!this.state.confirmReset ? (
            <button onClick={() => this.setState({ confirmReset: true })}
              style={{ padding: '10px 20px', border: '2px solid #dc0714', borderRadius: 8, background: 'white', color: '#dc0714', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
              Reset & Reload / 清除數據
            </button>
          ) : (
            <span style={{ display: 'inline-flex', gap: 6, alignItems: 'center' }}>
              <span style={{ fontSize: 12, color: '#dc0714' }}>確定？</span>
              <button onClick={() => { localStorage.clear(); location.reload(); }}
                style={{ padding: '8px 16px', border: 'none', borderRadius: 8, background: '#dc0714', color: 'white', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
                確認清除
              </button>
              <button onClick={() => this.setState({ confirmReset: false })}
                style={{ padding: '8px 16px', border: '1px solid #ccc', borderRadius: 8, background: 'white', color: '#666', fontSize: 13, cursor: 'pointer' }}>
                取消
              </button>
            </span>
          )}
        </div>
      );
    }
    return this.props.children;
  }
}

function RootApp() {
  const [activeTab, setActiveTab] = useState('tracker');
  const [pendingNextTrainStation, setPendingNextTrainStation] = useState(null);
  const [lang, setLang] = useState(() => { try { return localStorage.getItem('mtr-cs-lang') || 'zh'; } catch { return 'zh'; } });
  useEffect(() => { try { localStorage.setItem('mtr-cs-lang', lang); } catch {} }, [lang]);

  // Favourite stations
  const [favourites, setFavourites] = useState(() => {
    try { return JSON.parse(localStorage.getItem('mtr-cs-favourites') || '[]'); } catch { return []; }
  });
  useEffect(() => { try { localStorage.setItem('mtr-cs-favourites', JSON.stringify(favourites)); } catch {} }, [favourites]);
  const [trainCache, setTrainCache] = useState({});

  const toggleFavourite = useCallback((stationEn) => {
    setFavourites(prev =>
      prev.includes(stationEn) ? prev.filter(s => s !== stationEn) : [...prev, stationEn]
    );
  }, []);

  const refreshFavouriteTrains = useCallback(async (stations) => {
    if (!stations || stations.length === 0) return;
    const fetched = await Promise.all(stations.map(s => fetchNextTrain(s)));
    const now = Date.now();
    setTrainCache(prev => {
      const next = { ...prev };
      stations.forEach((s, i) => { if (fetched[i]) next[s] = { results: fetched[i], fetchedAt: now }; });
      return next;
    });
  }, []);

  const navigateToNextTrain = useCallback((stationEn) => {
    if (stationEn) setPendingNextTrainStation(stationEn);
    setActiveTab('nextTrain');
  }, []);

  // Ticket history
  const [history, setHistory] = useState(() => sanitizeHistory(readJSON('mtr-cs-history', [])));
  useEffect(() => { try { localStorage.setItem('mtr-cs-history', JSON.stringify(history)); } catch {} }, [history]);

  const archiveTicket = useCallback((record) => {
    setHistory(prev => [...prev, { ...record, id: Date.now() }]);
  }, []);
  const deleteHistoryRecord = useCallback((id) => {
    setHistory(prev => prev.filter(r => r.id !== id));
  }, []);
  const editHistoryRecord = useCallback((id, changes) => {
    setHistory(prev => prev.map(r => r.id === id ? { ...r, ...changes } : r));
  }, []);

  const [showOnboarding, setShowOnboarding] = useState(() => {
    try { return !localStorage.getItem('mtr-cs-onboarded'); } catch { return false; }
  });
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('mtr-cs-theme') || 'auto'; } catch { return 'auto'; }
  });
  const L = I18N[lang] || I18N.en;

  // Apply theme to <html> element
  useEffect(() => {
    const html = document.documentElement;
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    const applyResolved = (resolved) => {
      if (resolved === 'dark') html.setAttribute('data-theme', 'dark');
      else html.setAttribute('data-theme', 'light');
      if (metaTheme) metaTheme.content = resolved === 'dark' ? '#1a1a1a' : '#dc0714';
    };
    if (theme === 'dark' || theme === 'light') {
      applyResolved(theme);
    } else {
      // auto: detect system preference
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      applyResolved(mq.matches ? 'dark' : 'light');
      const handler = (e) => applyResolved(e.matches ? 'dark' : 'light');
      mq.addEventListener('change', handler);
      try { localStorage.setItem('mtr-cs-theme', theme); } catch {}
      return () => mq.removeEventListener('change', handler);
    }
    try { localStorage.setItem('mtr-cs-theme', theme); } catch {}
    window.__mtrTheme = theme;
  }, [theme]);

  // Listen for theme changes from Settings panel
  useEffect(() => {
    const handler = (e) => setTheme(e.detail);
    window.addEventListener('set-theme', handler);
    return () => window.removeEventListener('set-theme', handler);
  }, []);


  const dismissOnboarding = useCallback(() => {
    setShowOnboarding(false);
    try { localStorage.setItem('mtr-cs-onboarded', '1'); } catch {}
  }, []);

  if (showOnboarding) {
    return (
      <LangContext.Provider value={lang}>
        <div style={{
          position: 'fixed', top: 8, right: 8, zIndex: 10001, display: 'flex', gap: 4
        }}>
          <button
            onClick={() => setLang(prev => prev === 'en' ? 'zh' : 'en')}
            style={{
              minWidth: 36, minHeight: 36, background: 'rgba(26,26,46,0.85)',
              border: '1px solid rgba(255,255,255,0.15)', borderRadius: 8,
              color: 'white', fontSize: 11, fontWeight: 700, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              boxShadow: '0 2px 8px rgba(0,0,0,0.3)', backdropFilter: 'blur(8px)'
            }}
          >{lang === 'en' ? '繁中' : 'EN'}</button>
        </div>
        <OnboardingOverlay lang={lang} onDismiss={dismissOnboarding} />
      </LangContext.Provider>
    );
  }

  return (
    <LangContext.Provider value={lang}>
      <div>
        {/* Global action buttons — visible on all tabs */}
        <div className="header-actions" style={{ position: 'fixed', top: 18, right: 16, zIndex: 101 }}>
          <button onClick={() => setShowOnboarding(true)} title="Help">?</button>
          <button onClick={() => setLang(prev => prev === 'en' ? 'zh' : 'en')} style={{ fontSize: 10, fontWeight: 700 }}>{lang === 'zh' ? 'EN' : '繁'}</button>
          <button onClick={() => window.dispatchEvent(new Event('open-settings'))} title="Settings">⚙️</button>
        </div>

        {/* App is always mounted so its settings event listener stays active (portal renders to body) */}
        <div style={activeTab !== 'tracker' ? { display: 'none' } : undefined}>
          <App onArchive={archiveTicket} />
          <FavouriteQuickCard
            favourites={favourites}
            trainCache={trainCache}
            onRefresh={refreshFavouriteTrains}
            onNavigate={navigateToNextTrain}
          />
        </div>
        {activeTab === 'compare' && <FareComparisonPage />}
        {activeTab === 'history' && <HistoryPage history={history} onDelete={deleteHistoryRecord} onEdit={editHistoryRecord} />}
        {activeTab === 'nextTrain' && <NextTrainPage favourites={favourites} toggleFavourite={toggleFavourite} initialStation={pendingNextTrainStation} onStationConsumed={() => setPendingNextTrainStation(null)} />}

        <div className="disclaimer-footer">
          {lang === 'zh'
            ? <>本工具為獨立社區項目，與港鐵公司無任何關聯。「MTR」及「都會票」為港鐵公司之商標。車費數據來自 <a href="https://opendata.mtr.com.hk" target="_blank" rel="noopener">opendata.mtr.com.hk</a>，實時列車資料來自 <a href="https://data.gov.hk" target="_blank" rel="noopener">data.gov.hk</a>，公眾假期資料來自 <a href="https://www.1823.gov.hk" target="_blank" rel="noopener">1823.gov.hk</a>，依據香港政府開放數據授權條款使用。車費比較及津貼估算僅供參考，請以官方資料為準。本工具不收集任何個人資料，所有數據僅儲存於閣下裝置。</>
            : <>This is an independent community tool, not affiliated with MTR Corporation Limited. "MTR" and "City Saver" are trademarks of MTR Corporation Limited. Fare data from <a href="https://opendata.mtr.com.hk" target="_blank" rel="noopener">opendata.mtr.com.hk</a>. Train data from <a href="https://data.gov.hk" target="_blank" rel="noopener">data.gov.hk</a>. Holiday data from <a href="https://www.1823.gov.hk" target="_blank" rel="noopener">1823.gov.hk</a>. Used under the HK Government Open Data Licence. Estimates are for reference only. No personal data is collected.</>
          }
        </div>

        <div className="tab-bar">
          <button className={`tab-item ${activeTab === 'tracker' ? 'active' : ''}`} onClick={() => setActiveTab('tracker')}>
            <span className="tab-icon">📅</span>
            <span className="tab-label">{L.tracker}</span>
          </button>
          <button className={`tab-item ${activeTab === 'compare' ? 'active' : ''}`} onClick={() => setActiveTab('compare')}>
            <span className="tab-icon">💰</span>
            <span className="tab-label">{L.compareTab}</span>
          </button>
          <button className={`tab-item ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>
            <span className="tab-icon">📋</span>
            <span className="tab-label">{L.historyTab}</span>
          </button>
          <button className={`tab-item ${activeTab === 'nextTrain' ? 'active' : ''}`} onClick={() => setActiveTab('nextTrain')}>
            <span className="tab-icon">🚆</span>
            <span className="tab-label">{L.nextTrain}</span>
          </button>
        </div>
      </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><RootApp /></ErrorBoundary>);
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
